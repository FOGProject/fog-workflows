name: fogproject test suite

# Runs fogproject's own tests/run-all.sh against a pull request.
#
# Called as a reusable workflow by a small stub living in fogproject
# (.github/workflows/tests.yml), because a pull_request trigger can only
# fire from the repository the PR is opened against. The stub is six lines
# and never changes; everything that might change lives here, so a fix to
# the runner covers every branch at once instead of being propagated by
# hand.
#
# On the push-trigger incident documented at the top of
# update-lang-fix-psr-and-sync-version.yml:
# that loop existed because the workflow it triggered PUSHED A COMMIT back
# into fogproject, which re-fired the stub. This one writes nothing -- no
# token beyond the caller's read-only GITHUB_TOKEN, no commit, no API call --
# so there is nothing it can do that could trigger another run of itself.
# A pull_request trigger is also not a push trigger: it fires on PR events,
# and the bot pushes that caused the runaway were direct-to-branch.
#
# Why this is worth having at all: every gate written across the Phase 0-3
# modernization -- 43 of them, several mutation-verified -- ran only when
# somebody remembered to run them locally. tests/run-all.sh says in its own
# docblock that CI is where it belongs; until now there was no CI to put it
# in. See fogproject GH-1136 for the class of bug these catch.

on:
  workflow_call:
    # Both inputs default to the caller's own event, so fogproject's six-line
    # stub keeps working unchanged and every existing pull request behaves
    # exactly as before.
    #
    # They exist for stable-releases.yml (fogproject GH-1222), which lives in
    # THIS repository. A bare `actions/checkout` resolves to the CALLING
    # repository, so without `repository` the release gate would check out
    # fog-workflows, find no tests/run-all.sh, and PASS -- a silent green on a
    # tree that was never tested. That failure mode is why the input is
    # required in practice even though it is optional in the schema.
    inputs:
      repository:
        description: 'Repository to test. Defaults to the caller (the fogproject stub).'
        required: false
        type: string
        default: ''
      branch:
        description: 'Ref to test. Defaults to the caller''s event ref (the PR merge ref).'
        required: false
        type: string
        default: ''

concurrency:
  group: fogproject-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is fogproject's supported floor (commons/init.php _verCheck);
        # 8.3 is what the project is developed on. Running both is what
        # catches the documented failure where PHP-8-only syntax lints
        # clean and then dies as a bodyless 500 on a 7.4 server.
        php: ['7.4', '8.3']

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gettext is not optional. Seven tests exercise code paths that
          # call _(), and without the extension they die on "Call to
          # undefined function FOG\_()" -- which reads as a failing suite
          # rather than a missing extension. openssl is used by the PKI
          # tests. Both verified against php:7.4-cli, where the bare image
          # fails 7 of 43 for exactly this reason.
          extensions: gettext, openssl, json
          coverage: none

      - name: Does this branch have the Secure Boot test?
        id: sb_test
        # Same reasoning as the composer probe in the vendor job below: this
        # workflow is shared by every fogproject branch, and only the 1.6 line
        # carries tests/secureboot-authvars.test.sh. On dev-branch the apt
        # install below buys nothing at all -- and it is not free. It is the
        # single flakiest step here: a transient apt failure or a slow mirror
        # wedges it for twenty minutes and takes the whole run with it, which
        # is how a green dev-branch pull request came to need a manual rerun
        # (fogproject#1170).
        #
        # Decided from the tree rather than from the branch name, because the
        # branch that has the test is a thing that will change and the presence
        # of the file is the actual precondition.
        run: |
          if [ -f tests/secureboot-authvars.test.sh ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            {
              echo '### efitools'
              echo ''
              echo 'No `tests/secureboot-authvars.test.sh` on this branch, so'
              echo 'there is nothing for efitools to enforce. Not installed.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install efitools
        if: steps.sb_test.outputs.present == 'true'
        # secureboot-authvars.test.sh skips itself when efitools is absent,
        # and run-all.sh counts a skip as a pass. Installing it is the
        # difference between that test being enforced and being decorative,
        # which is the whole point of this workflow.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq efitools

      - name: Confirm the checkout actually carries the suite
        # Fail loudly rather than green-ly. `run:` steps default to
        # `bash -e {0}` with NO pipefail, so `sh tests/run-all.sh | tee ...`
        # on a tree without that file exits 127 into a tee that exits 0 --
        # the step PASSES. Every other check in this workflow (secureboot,
        # composer, schema) probes for its file and skips when absent, so a
        # checkout of the wrong repository would report a clean green run
        # having tested nothing at all. That mode became reachable the moment
        # this workflow grew a `repository` input, so it is closed here.
        run: |
          if [ ! -f tests/run-all.sh ]; then
            echo "::error::No tests/run-all.sh in ${{ inputs.repository || github.repository }}@${{ inputs.branch || github.ref }}."
            echo "::error::Nothing was tested. Check the repository/branch inputs."
            exit 1
          fi

      - name: Run the suite
        # Several tests enumerate the tree with `git ls-files` and fail
        # closed ("Is this a git checkout?") if it returns nothing, so the
        # checkout has to stay a real repository -- do not swap this for an
        # archive download.
        run: sh tests/run-all.sh | tee "$RUNNER_TEMP/suite.txt"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### PHP ${{ matrix.php }}"
            echo ''
            echo '```'
            tail -n 5 "$RUNNER_TEMP/suite.txt" 2>/dev/null || echo 'suite produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  vendor:
    name: vendor matches composer.lock
    runs-on: ubuntu-latest

    # tests/vendor-committed.test.php already checks that every locked package
    # is PRESENT and that the advisory acceptance is still declared. What it
    # cannot check is CONTENT: a package directory edited by hand, or left
    # behind at an older version by a partial regeneration, passes it. Phase 0
    # chose committed vendor/ over `composer install` on the customer's server
    # (ADR 0013), so those bytes ARE the dependency -- nothing downstream would
    # ever correct them.

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - name: Does this branch have a composer tree?
        id: composer_tree
        # This workflow is shared by every fogproject branch, and only the
        # 1.6 line has a composer tree -- committed vendor/ arrived with
        # Phase 0.3. dev-branch has no packages/web/composer.json at all, so
        # `composer validate` exited non-zero there and EVERY dev-branch pull
        # request showed a red check for a file it is not supposed to have.
        # A red check that is always red teaches people to ignore red checks,
        # which costs more than the job is worth.
        #
        # Decided from the tree rather than from the branch name, because the
        # branch that has a composer tree is a thing that will change and the
        # presence of the file is the actual precondition.
        run: |
          if [ -f packages/web/composer.json ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            {
              echo '### vendor/'
              echo ''
              echo 'No `packages/web/composer.json` on this branch, so there'
              echo 'is no locked dependency tree to verify. Skipped.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up PHP 7.4 and Composer
        if: steps.composer_tree.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          # 7.4 because composer.json pins config.platform.php to 7.4.0. The
          # point of that pin is that the resolved tree is a property of the
          # repository rather than of whichever PHP the maintainer happened to
          # run, so the check has to resolve under it too.
          php-version: '7.4'
          tools: composer:v2
          extensions: json, openssl
          coverage: none

      - name: Validate composer.json against composer.lock
        if: steps.composer_tree.outputs.present == 'true'
        # Not --strict: it fails on the "version field is present" advisory,
        # and that field is deliberate -- FOG is not published on Packagist
        # and the installer reads its own version from the tree. Plain
        # validate still catches a malformed manifest and, more usefully, a
        # lock that has fallen out of step with the requirements.
        run: composer validate
        working-directory: packages/web

      - name: Reinstall from the lock
        if: steps.composer_tree.outputs.present == 'true'
        run: composer install --no-interaction --no-progress
        working-directory: packages/web

      - name: Compare package content
        if: steps.composer_tree.outputs.present == 'true'
        # The exclusions are the point of this step. vendor/composer/* and
        # vendor/autoload.php are Composer's own scaffolding, and their bytes
        # are a function of the COMPOSER BINARY, not of composer.lock --
        # proven locally, where a 2.10.2 image regenerated an
        # InstalledVersions.php two guard clauses behind the committed one.
        # Diffing them would fail every pull request the moment the runner's
        # Composer and the maintainer's diverge, which is the generated-
        # artifact version skew this project has already been bitten by
        # elsewhere. The dependency's own files carry no such dependency and
        # are where a hand-edit or a stale package would show, so those fail
        # hard.
        run: |
          git diff --exit-code -- packages/web/vendor \
            ':!packages/web/vendor/composer' \
            ':!packages/web/vendor/autoload.php'

      - name: Report scaffolding drift
        # Reported rather than enforced, for the reason above. It is still
        # worth seeing: a change here means the tree was last regenerated by a
        # different Composer, which is the thing to know before believing a
        # vendor diff in some later pull request.
        #
        # always() so it still reports when an earlier step failed, AND the
        # tree check, so it does not run `composer --version` on a branch
        # where Composer was never installed.
        if: always() && steps.composer_tree.outputs.present == 'true'
        run: |
          {
            echo '### vendor/'
            echo ''
            if git diff --quiet -- packages/web/vendor/composer \
                packages/web/vendor/autoload.php; then
              echo "Composer scaffolding unchanged ($(composer --version))."
            else
              echo "Composer scaffolding differs from the committed tree."
              echo "This is normal when the runner's Composer is not the one"
              echo 'that generated it, and is not enforced:'
              echo ''
              echo '```'
              git diff --stat -- packages/web/vendor/composer \
                packages/web/vendor/autoload.php
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  schema:
    name: schema on ${{ matrix.server }}
    runs-on: ubuntu-latest

    # Nothing in CI has ever executed FOG's schema against a database. Four
    # independent reasons, all true before this job existed:
    #
    #   1. the `suite` job above runs on a PHP matrix with no database at all;
    #   2. tests/schema-portable-collation.test.php is textual BY DESIGN -- its
    #      docblock says commons/schema.php "calls self::$DB->query() at file
    #      scope and cannot be included without a database";
    #   3. run_all_distros.yml is workflow_dispatch only, so distro installs
    #      never fire on a pull request;
    #   4. reusable_distro_workflow.yml cloned a hardcoded dev-branch, so even a
    #      manual dispatch never installed the 1.6 schema.
    #
    # fogproject GH-1147's own commit message states the problem: "this cannot
    # be caught by the person introducing it: on the generating server every one
    # of these statements is valid." Only an older server ever sees it. This is
    # how an older server gets to see it. fogproject GH-1221.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The realistic floor, and the exact version in the GH-1147 report
          # (10.5.29 on Rocky 9). Also the first time anyone has actually RUN
          # the CHARSET=utf8mb3 probe GH-1152 flags as unverified inference.
          - server: mariadb:10.5
            image: mariadb:10.5
            tolerated: false
          # First version on the far side of the collation boundary: 11.4 made
          # utf8mb3_uca1400_ai_ci the default for the Unicode charsets.
          #
          # continue-on-error because the collation assertion is EXPECTED to
          # fail here until fogproject GH-1152 is decided -- that failure is the
          # evidence GH-1152 says it is missing, and this is how it gets
          # measured rather than argued. Reddening every pull request over an
          # undecided question teaches people to ignore red checks, which is the
          # same reasoning already written into the composer_tree probe above.
          #
          # REMOVE THIS the moment GH-1152 lands. It is not a standing excuse.
          - server: mariadb:11.4 (GH-1152, non-blocking)
            image: mariadb:11.4
            tolerated: true
          # MySQL has never had the UCA-14.0.0 collations at all, so it catches
          # the same class of failure from the other vendor.
          - server: mysql:8.0
            image: mysql:8.0
            tolerated: false

    services:
      db:
        image: ${{ matrix.image }}
        env:
          # Both spellings deliberately: the mariadb images read MARIADB_*, and
          # mysql:8.0 reads MYSQL_*. Setting both lets one services block cover
          # both vendors instead of needing a matrix of env blocks as well.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 || mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - name: Does this branch have the schema execution test?
        id: schema_test
        # Same probe pattern as sb_test and composer_tree above, and for the
        # same reason: this workflow is shared by every fogproject branch, and
        # only the 1.6 line carries tests/schema-executes.test.php. Decided from
        # the tree rather than the branch name, because the branch that has the
        # test is a thing that will change and the presence of the file is the
        # actual precondition.
        run: |
          if [ -f tests/schema-executes.test.php ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            {
              echo '### schema'
              echo ''
              echo 'No `tests/schema-executes.test.php` on this branch, so there'
              echo 'is nothing to execute. Skipped.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up PHP 7.4
        if: steps.schema_test.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          # 7.4 is fogproject's supported floor and the schema has to install on
          # it. pdo_mysql is what this job is FOR -- without it the test fails
          # closed rather than skipping, which is deliberate: a DSN was
          # provided, so skipping would report a pass for a check that never ran.
          php-version: '7.4'
          extensions: pdo_mysql, gettext, openssl, json
          coverage: none

      - name: Wait for the server
        if: steps.schema_test.outputs.present == 'true'
        # The service health check gates the job STARTING, not the server being
        # ready on the mapped port, and mysql:8.0 in particular keeps
        # initialising after it first answers ping. Connecting the way the test
        # will is the only check that means anything here.
        run: |
          for i in $(seq 1 30); do
            if php -r 'new PDO("mysql:host=127.0.0.1;port=3306", "root", "");' 2>/dev/null; then
              echo "server accepting connections after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::database service never accepted a connection"
          exit 1

      - name: Execute the schema
        if: steps.schema_test.outputs.present == 'true'
        continue-on-error: ${{ matrix.tolerated }}
        env:
          FOG_TEST_DSN: mysql:host=127.0.0.1;port=3306
          FOG_TEST_USER: root
          FOG_TEST_PASS: ""
        run: php tests/schema-executes.test.php 2>&1 | tee "$RUNNER_TEMP/schema.txt"

      - name: Summarise
        if: always() && steps.schema_test.outputs.present == 'true'
        run: |
          {
            echo "### schema on ${{ matrix.server }}"
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/schema.txt" 2>/dev/null || echo 'no output'
            echo '```'
            if [ "${{ matrix.tolerated }}" = "true" ]; then
              echo ''
              echo '> Non-blocking. A collation failure on this leg is fogproject GH-1152,'
              echo '> an open decision rather than a regression.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  pins:
    name: release pins resolve
    runs-on: ubuntu-latest

    # fogproject GH-1030. Since GH-1029 the bundled plugins and the iPXE
    # binaries are fetched from pinned releases rather than committed, and
    # nothing checked that a pin points at anything real. A typo, or bumping
    # the pin before cutting the release, produces a tree that lints, commits
    # and merges cleanly and then fails at install time -- on the person
    # installing rather than the person who made the mistake.
    #
    # A tag existing is NOT enough. Release assets are uploaded separately
    # from the tag, so a tag with no assets fails the install in exactly the
    # same way; the check has to look at the asset names.

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.ref }}

      - name: Resolve every pin this branch actually has
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sys=packages/web/lib/fog/system.class.php
          if [ ! -f "$sys" ]; then
            echo "No $sys on this branch; nothing to check."
            exit 0
          fi

          # Same awk the installer uses (lib/common/config.sh), so the check
          # and the fetcher cannot disagree about what the pin says. Read
          # rather than reused as a script because config.sh expects to be
          # sourced from bin/ with the whole installer environment around it.
          pin() {
            awk -F\' /"define\('$1'[,](.*)"/'{print $4}' "$sys" 2>/dev/null \
              | tr -d '[[:space:]]'
          }

          # Every pin is optional, and which ones exist is read from the tree
          # rather than from the branch name -- this workflow is shared by
          # every fogproject branch, and dev-branch and stable carry only the
          # iPXE pin. Deciding from the branch name means a new branch is
          # silently unchecked. (Same reasoning as the vendor job above.)
          ipxe=$(pin FOG_IPXE_VERSION)
          plugins=$(pin FOG_PLUGINS_VERSION)

          # The Secure Boot tarball is a separate asset and not every branch
          # fetches it, so ask the installer on THIS branch whether it does
          # instead of assuming. Missing it is a real failure where it is
          # fetched and a false one where it is not.
          sb=no
          grep -q 'fog-ipxe-secureboot-' lib/common/functions.sh 2>/dev/null && sb=yes

          rc=0
          # $1 repo, $2 pin name, $3 version, $4... asset basenames
          check() {
            local repo=$1 name=$2 ver=$3; shift 3
            if [ -z "$ver" ]; then
              echo "· $name is not set on this branch, skipping"
              return 0
            fi
            echo "· $name = $ver  ($repo)"
            local assets
            if ! assets=$(gh api "repos/$repo/releases/tags/$ver" \
                            --jq '.assets[].name' 2>/dev/null); then
              echo "::error::$name is set to '$ver' but FOGProject/${repo#*/} has no such release. The installer will fail with 'Could not download ... from https://github.com/$repo'."
              rc=1
              return 0
            fi
            local want
            for want in "$@"; do
              for suffix in '' '.sha256'; do
                if ! printf '%s\n' "$assets" | grep -qxF "${want}${suffix}"; then
                  echo "::error::$name release '$ver' exists but is missing the asset '${want}${suffix}' that the installer fetches. A release whose assets were never uploaded fails the install exactly like a missing tag."
                  rc=1
                fi
              done
            done
            printf '%s\n' "$assets" | sed 's/^/    have: /'
          }

          check FOGProject/fog-plugins FOG_PLUGINS_VERSION "$plugins" \
            "fog-plugins-${plugins}.tar.gz"

          ipxe_assets=("fog-ipxe-${ipxe}.tar.gz")
          [ "$sb" = yes ] && ipxe_assets+=("fog-ipxe-secureboot-${ipxe}.tar.gz")
          check FOGProject/fog-ipxe FOG_IPXE_VERSION "$ipxe" "${ipxe_assets[@]}"

          if [ "$rc" -ne 0 ]; then
            echo
            echo "A pin names a release that does not exist or is missing an asset."
            echo "Cut the release (and upload its assets) before bumping the pin here."
          fi
          exit "$rc"
