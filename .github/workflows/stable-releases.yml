name: Stable Release

on:
  workflow_dispatch:
  schedule:
  - cron: "11 11 11 * *"

jobs:

  sync-and-check-dev-branch-before-release:
    uses: ./.github/workflows/update-lang-fix-psr-and-sync-version.yml
    with:
      branch: "dev-branch"
      # Explicit, though false is already the default, because THIS is the path
      # where getting it wrong ships to users.
      #
      # fogproject's merge stub now passes version_only: true -- its formatting
      # and catalogue are corrected on each pull request before it merges, so
      # repeating them per-merge is a guaranteed no-op. None of that reasoning
      # holds here. This job is the last whole-tree pass before dev-branch is
      # promoted to stable and tagged, and it has to cover the things PR-time
      # regeneration cannot: anything merged from a fork, anything pushed
      # directly to dev-branch, and every commit that predates PR-time
      # regeneration existing at all.
      #
      # So this runs the full sweep -- gettext regeneration and php-cs-fixer
      # over the whole of packages/web, not just changed files. Do not "align"
      # it with the merge stub.
      version_only: false
    secrets: inherit
  
  create-release-pull-request:
    needs: sync-and-check-dev-branch-before-release
    runs-on: ubuntu-24.04
    outputs:
      skip_release: ${{ steps.create_pr.outputs.skip_release }}
      release_tag: ${{ steps.create_pr.outputs.tag }}
      previous_tag: ${{ steps.create_pr.outputs.prevTag }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get version to be released and create PR with that in the name
        id: create_pr
        run: |
          echo 'Get version to be released and create PR with that in the name'
          # sync-and-check-dev-branch-before-release (above) already ran the version sync
          # workflow for dev-branch, which always rewrites badges/dev-branch.json to the
          # current FOG_VERSION whether or not it drifted - so this file is already fresh,
          # no need to check out fogproject and grep system.class.php for it.
          tag=$(jq -r '.message' badges/dev-branch.json)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          prevTag=$(gh release view --repo FOGProject/fogproject --json tagName --jq '.tagName')
          echo "prevTag=$prevTag" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"
          echo "Previous Tag: $prevTag"
          if [[ "$tag" == "$prevTag" ]]; then
            echo "Not a new version. Exiting nothing to do"
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
            gh pr create -R FOGProject/fogproject -B stable -H dev-branch --title "Stable Release PR For ${tag} - $(date '+%Y-%m-%d')" --body "Pull Request for creating the latest stable release from staged security fixes, bug fixes, and minor enhancements in dev-branch. Created as needed or monthly on 11th of every month (queued in gh actions at 11:11 UTC), released once tests are passing"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  no-release-needed:
    needs: create-release-pull-request
    if: needs.create-release-pull-request.outputs.skip_release == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Announce no release on Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: "Hey @everyone, Nothing to release. PR not created, latest remains ${{ needs.create-release-pull-request.outputs.previous_tag }}."
          title: "No changes - no release"
          color: 0xffe135

  run-unit-tests:
    # fogproject GH-1222. Until this existed, the ONLY validation between
    # "create the release PR" and "merge and tag" was that FOG installs. The
    # unit suite -- 43+ gates, several mutation-verified -- ran on pull
    # requests only, so anything that reached dev-branch by another route (a
    # direct push, the sync bot above, a merge whose PR checks were stale) was
    # never re-checked before it shipped in a stable release.
    #
    # dev-branch is the head of the release PR created above, so that is the
    # tree being released and the tree to test. The repository must be named:
    # this workflow lives in fog-workflows, and a bare checkout would resolve
    # HERE.
    needs: create-release-pull-request
    if: needs.create-release-pull-request.outputs.skip_release != 'true'
    uses: ./.github/workflows/fogproject-tests.yml
    with:
      repository: "FOGProject/fogproject"
      branch: "dev-branch"

  run-install-tests:
    # Gated on the unit suite: no point spinning up every distro container to
    # install a tree whose own tests do not pass.
    needs: [create-release-pull-request, run-unit-tests]
    if: needs.create-release-pull-request.outputs.skip_release != 'true'
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ needs.create-release-pull-request.outputs.release_tag }}
      previous_tag: ${{ needs.create-release-pull-request.outputs.previous_tag }}
      dispatched_at: ${{ steps.dispatch-time.outputs.dispatched_at }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fog-workflows"

      - name: Record the dispatch time
        # gh workflow run does not report the run id it creates, so the next
        # job has to find the run for itself. Stamping the time here lets it
        # select the run WE started rather than whatever happens to be newest.
        id: dispatch-time
        run: echo "dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Call main workflow that calls all the distros
        run: gh workflow run run_all_distros.yml
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Required. This job has no checkout, so gh has no git remote to
          # resolve the repo from and dies with "not a git repository". "This
          # repo" is only implicit to gh once a checkout has put a remote on
          # disk -- it is not implicit from being inside Actions. Set per step
          # rather than on the workflow: later jobs check out FOGProject/
          # fogproject and rely on that remote for bare gh pr calls, and
          # GH_REPO would override it.
          GH_REPO: ${{ github.repository }}

  check-all-tests-completed-successfully:
    needs: run-install-tests
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ needs.run-install-tests.outputs.release_tag }}
      previous_tag: ${{ needs.run-install-tests.outputs.previous_tag }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fog-workflows"

      - name: Find the run we dispatched
        # Was: sleep 60, then take --limit 1. That gates the release on the
        # newest run of run_all_distros.yml, which is not necessarily ours --
        # it is workflow_dispatch-only, but any maintainer can start it by
        # hand while a release is in flight, and the distro suite is exactly
        # what someone runs when debugging a distro. Gating on their run fails
        # the release for reasons that have nothing to do with it; worse, if
        # our own dispatch had not registered within that flat minute,
        # --limit 1 returned an older success and stable merged having run no
        # tests at all.
        run: |
          run_id=""
          for attempt in $(seq 1 20); do
            run_id=$(gh run list --workflow run_all_distros.yml --json databaseId,createdAt --limit 20 \
              | jq -r --arg t "$DISPATCHED_AT" \
                  '[.[] | select(.createdAt >= $t)] | sort_by(.createdAt) | .[0].databaseId // empty')
            if [[ -n $run_id ]]; then
              break
            fi
            echo "No run_all_distros.yml run created since ${DISPATCHED_AT} yet (attempt ${attempt}/20)"
            sleep 15
          done

          if [[ -z $run_id ]]; then
            echo "::error::No run_all_distros.yml run appeared within 5 minutes of ${DISPATCHED_AT}"
            exit 1
          fi

          echo "Gating this release on run ${run_id}"
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DISPATCHED_AT: ${{ needs.run-install-tests.outputs.dispatched_at }}

      - name: Check if distro workflow passed or failed
        # An in-progress run reports a null conclusion, so poll until it is
        # anything else and then demand success. The old loop broke only on
        # success/failure, so a cancelled or timed_out run spun here until the
        # job hit its own timeout.
        run: |
          run_status="null"
          while [[ -z $run_status || $run_status == "null" ]]; do
            sleep 15
            run_status=$(gh run view "$RUN_ID" --json conclusion | jq -r '.conclusion')
          done

          echo "Run ${RUN_ID} concluded: ${run_status}"
          if [[ $run_status != "success" ]]; then
            exit 1
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}

  merge-after-all-tests-passed:
    needs: check-all-tests-completed-successfully
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ needs.check-all-tests-completed-successfully.outputs.release_tag }}
      previous_tag: ${{ needs.check-all-tests-completed-successfully.outputs.previous_tag }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
            client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
            private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
            owner: FOGProject
            repositories: "fogproject"

      - name: Checkout Stable
        uses: actions/checkout@v7
        with: 
            token: ${{ steps.app-token.outputs.token }}
            repository: FOGProject/fogproject
            ref: stable
            persist-credentials: false

      - name: Merge the PR
        run: |
            echo "merge the pull request bringing dev-branch into stable";
            tag=${{ needs.check-all-tests-completed-successfully.outputs.release_tag }}
            gh pr merge dev-branch --merge --subject "Stable Release - ${tag}";
        env:
            GH_TOKEN: ${{ steps.app-token.outputs.token }}

  close-pr-if-tests-fail:
    # One arm per gate job, and `if: failure()` is not a substitute for any of
    # them. A job whose dependency was SKIPPED is itself skipped unless its
    # condition is always()-rooted -- and an always()-rooted condition matches
    # nothing implicitly, so every failure it should catch has to be named.
    # Only the first gate to fail reports 'failure'; the gates behind it report
    # 'skipped', which is not 'failure' and matches no arm on its own.
    #
    # MAINTENANCE RULE: adding a gate job in front of the merge means adding an
    # arm here. Miss one and the release PR is left open with no Discord
    # announcement -- a release that quietly stalls instead of visibly failing.
    # That is not hypothetical: run-install-tests was added to the chain
    # without an arm, and when it failed on 2026-09-11 this job was skipped and
    # fogproject#1761 sat open in silence. See fogproject GH-1222.
    #
    # Only the three PRE-MERGE gates belong here. sync-and-check-... failing
    # skips PR creation, so there is nothing to close; the post-merge jobs
    # (merge-after-all-tests-passed, tag-and-release, sync-branches) fail after
    # the PR is already merged, where closing it would be wrong.
    #
    # Enumerated rather than contains(needs.*.result, 'failure') because the
    # wildcard would also match create-release-pull-request, which is in needs
    # only for its outputs -- and when THAT fails there is no PR to close.
    needs: [create-release-pull-request, run-unit-tests, run-install-tests, check-all-tests-completed-successfully]
    runs-on: ubuntu-24.04
    if: >-
      always() &&
      (needs.run-unit-tests.result == 'failure' ||
       needs.run-install-tests.result == 'failure' ||
       needs.check-all-tests-completed-successfully.result == 'failure')

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
            client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
            private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
            owner: FOGProject
            repositories: "fogproject"

      - name: Checkout Stable
        uses: actions/checkout@v7
        with: 
            token: ${{ steps.app-token.outputs.token }}
            repository: FOGProject/fogproject
            ref: stable
            persist-credentials: false

      - name: Get PR number
        run: |
           pr_number=$(gh pr list --search "is:open Stable Release PR For* in:title" --repo FOGProject/fogproject --json title,number --jq '.[] | select(.title | test("Stable Release PR For*"; "i")) | .number' | head -n 1)
           echo "PR_NUMBER=$pr_number" >> $GITHUB_ENV
        env:
            GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Close PR
        # An empty PR_NUMBER is not a reason to fail the job. It means no open
        # release PR matched -- closed by hand, or never opened at all -- and
        # failing here would abort before the announcement, which is the part
        # that must not be lost.
        run: |
          if [[ -z ${PR_NUMBER:-} ]]; then
            echo "::warning::No open stable release PR found to close"
            echo "PR_OUTCOME=no open release PR was found to close" >> "$GITHUB_ENV"
            exit 0
          fi

          gh pr close "$PR_NUMBER" --comment "Closing PR due to failure in tests" --repo FOGProject/fogproject
          echo "PR_OUTCOME=PR ${PR_NUMBER} closed" >> "$GITHUB_ENV"
        env:
            GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Announce error on Discord
        # always(): a failure in either step above must not swallow the
        # announcement, or the release goes silent for a second reason.
        #
        # status is hard-coded rather than derived from
        # check-all-tests-completed-successfully.result, which is 'skipped'
        # whenever run-install-tests is the gate that failed. The action
        # documents Success, Failure and Cancelled only. This job runs on a
        # failure arm and nothing else, so the status is already known.
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: "Hey @everyone, validation tests failed -- ${{ env.PR_OUTCOME || 'release PR state unknown, check it by hand' }}. Release ${{ needs.create-release-pull-request.outputs.release_tag }} NOT CREATED, latest remains ${{ needs.create-release-pull-request.outputs.previous_tag }}. Please check the logs for details."
          title: Validation tests
          status: failure
          color: 0xff0000

  tag-and-release:
    needs: merge-after-all-tests-passed
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ needs.merge-after-all-tests-passed.outputs.release_tag }}
      previous_tag: ${{ needs.merge-after-all-tests-passed.outputs.previous_tag }}

    steps:
    - uses: actions/create-github-app-token@v3
      id: app-token
      with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

    - name: Checkout Stable
      uses: actions/checkout@v7
      with:
          token: ${{ steps.app-token.outputs.token }}
          repository: FOGProject/fogproject
          ref: stable
          # Fetch full history and tags so the previous release tag resolves for git log
          fetch-depth: 0
          persist-credentials: false

    - name: Checkout fog-workflows (for version badges)
      uses: actions/checkout@v7
      with:
          path: fog-workflows
          persist-credentials: false

    - name: Initialize Release Environment Variables
      run: |
        echo "TAG=${{ needs.merge-after-all-tests-passed.outputs.release_tag }}" >> $GITHUB_ENV
        echo "PREV_TAG=${{ needs.merge-after-all-tests-passed.outputs.previous_tag }}" >> $GITHUB_ENV
        echo "NOTES_FILE=$RUNNER_TEMP/release_body.md" >> $GITHUB_ENV
        echo "WORKING_1_6=$(jq -r '.message' fog-workflows/badges/working-1.6.json)" >> $GITHUB_ENV

    - name: Generate Base PR Notes
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          /repos/FOGProject/fogproject/releases/generate-notes \
          -f tag_name="$TAG" \
          -f previous_tag_name="$PREV_TAG" \
          -f target_commitish="stable" \
          -q .body > "$NOTES_FILE"
          
        # Adding || true ensures sed doesn't crash the script if no matches are found
        sed -i "s/## What's Changed/## Pull Requests/" "$NOTES_FILE" || true
        sed -i "/^\* .*${PREV_TAG}/Id" "$NOTES_FILE" || true

    - name: Append Commits
      continue-on-error: true
      run: |
        echo "" >> "$NOTES_FILE"
        echo "---" >> "$NOTES_FILE"
        echo "" >> "$NOTES_FILE"
        echo "## Commits" >> "$NOTES_FILE"
        echo "" >> "$NOTES_FILE"
        
        git log ${PREV_TAG}..HEAD --reverse --invert-grep -i --grep="^Stable Release" --grep="^merge stable" --grep="^Merge pull request #" --grep="^chore: fix stale FOG_VERSION/FOG_CHANNEL" --pretty=format:"* %s ([%h](https://github.com/FOGProject/fogproject/commit/%H))" >> "$NOTES_FILE"

    - name: Append Closed Issues
      continue-on-error: true
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        prevDate=$(git log -1 --format=%aI "$PREV_TAG")
        closedIssues=$(gh issue list --repo FOGProject/fogproject \
          --search "is:issue is:closed closed:>=$prevDate" \
          --limit 100 \
          --json number,title,url \
          --jq '.[] | "* \(.title) ([#\(.number)](\(.url)))"')
          
        if [ -n "$closedIssues" ]; then
          echo "" >> "$NOTES_FILE"
          echo "---" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"    
          echo "## Closed Issues Since Last Release" >> "$NOTES_FILE"
          echo "$closedIssues" >> "$NOTES_FILE"
        fi

    - name: Append and Update Security Advisories
      continue-on-error: true
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
          prevDate=$(git log -1 --format=%aI "$PREV_TAG")
          
          gh api /repos/FOGProject/fogproject/security-advisories \
            | jq --arg date "$prevDate" '[.[] | select(.published_at >= $date)]' > "$RUNNER_TEMP/new_advisories.json"
            
          secAdvisories=$(jq -r '.[] | "* \(.summary) ([\(.ghsa_id)](\(.html_url)))"' "$RUNNER_TEMP/new_advisories.json")
          
          if [ -n "$secAdvisories" ]; then
            echo "" >> "$NOTES_FILE"
            echo "---" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"    
            echo "## Security Advisories" >> "$NOTES_FILE"
            echo "$secAdvisories" >> "$NOTES_FILE"
            
            ghsa_ids=$(jq -r '.[] | .ghsa_id' "$RUNNER_TEMP/new_advisories.json")
            
            for ghsa_id in $ghsa_ids; do
              echo "Updating Security Advisory $ghsa_id with patched version >=$TAG..."
              current_vulns=$(gh api /repos/FOGProject/fogproject/security-advisories/"$ghsa_id" --jq '.vulnerabilities')

              # GitHub's PATCH validation requires package.ecosystem to be a real enum value.
              # Manually-added advisory entries can come back from GET with ecosystem/name as
              # "" (shown as "Other" in the UI) rather than the "other" enum value, which the
              # PATCH then rejects with a 422 if echoed back unchanged.
              #
              # Also appends the current working-1.6 beta version (from badges/working-1.6.json)
              # when patched_versions doesn't already mention a 1.6 line - historically these
              # advisories affecting both branches got a manual 1.6.0-beta.NNNN entry too.
              updated_vulns=$(echo "$current_vulns" | jq --arg new_tag ">=$TAG" --arg beta_tag ">=$WORKING_1_6" 'map(
                .package.ecosystem = (if .package.ecosystem == "" or .package.ecosystem == null then "other" else .package.ecosystem end) |
                .package.name = (if .package.name == "" or .package.name == null then "FOGProject" else .package.name end) |
                (if .patched_versions == "" or .patched_versions == null then $new_tag else .patched_versions + ", " + $new_tag end) as $with_stable |
                .patched_versions = (if ($with_stable | test("1\\.6")) then $with_stable else $with_stable + ", " + $beta_tag end)
              )')
              
              echo "{\"vulnerabilities\": $updated_vulns}" > "$RUNNER_TEMP/patch_payload.json"
              
              gh api \
                --method PATCH \
                -H "Accept: application/vnd.github+json" \
                /repos/FOGProject/fogproject/security-advisories/"$ghsa_id" \
                --input "$RUNNER_TEMP/patch_payload.json"
            done
          fi

    - name: Publish Release
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh release create "$TAG" --latest -F "$NOTES_FILE" --target stable --title "$TAG"

    - name: Update stable version badge
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        path="badges/stable.json"
        body=$(jq -n --arg message "$TAG" \
          '{schemaVersion: 1, label: "stable", message: $message, color: "blue", cacheSeconds: 3600}')
        content=$(printf '%s' "$body" | base64 -w0)

        sha=$(gh api "repos/FOGProject/fog-workflows/contents/$path" --jq .sha 2>/dev/null || true)
        if [ -n "$sha" ]; then
          gh api "repos/FOGProject/fog-workflows/contents/$path" -X PUT \
            -f message="chore: update stable version badge" \
            -f content="$content" -f sha="$sha" >/dev/null
        else
          gh api "repos/FOGProject/fog-workflows/contents/$path" -X PUT \
            -f message="chore: add stable version badge" \
            -f content="$content" >/dev/null
        fi

  sync-branches:
    needs: tag-and-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: FOGProject/fogproject
          ref: stable
          persist-credentials: false

      - name: Sync stable into dev-branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.tag-and-release.outputs.release_tag }}
        run: |
          gh pr create -B dev-branch -H stable --title "merge stable - ${TAG} into dev" --body "Pull Request for syncing stable release commit back to dev after a release"
          gh pr merge stable --merge --subject "merge stable - ${TAG} into dev"
  
  discord-success:
    needs: tag-and-release
    runs-on: ubuntu-24.04

    steps:
      - name: Announce success on Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "New release"
          description: Click [here](https://github.com/fogproject/fogproject/releases/tag/${{ needs.tag-and-release.outputs.release_tag }}) to check the ${{ needs.tag-and-release.outputs.release_tag }} release notes.
          color: 0x00ff00
