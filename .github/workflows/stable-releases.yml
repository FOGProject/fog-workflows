name: Stable Release

on:
  workflow_dispatch:
  schedule:
  - cron: "11 11 11 * *"

jobs:

  update-dev-branch-version-if-needed:
    uses: ./.github/workflows/check-fog-version.yml
    with:
      branch: "dev-branch"
    secrets: inherit
  
  create-release-pull-request:
    needs: update-dev-branch-version-if-needed
    runs-on: ubuntu-24.04
    outputs:
      skip_release: ${{ steps.create_pr.outputs.skip_release }}
      release_tag: ${{ steps.create_pr.outputs.tag }}
      previous_tag: ${{ steps.create_pr.outputs.prevTag }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: FOGProject/fogproject
          ref: dev-branch
          persist-credentials: false

      - name: Get version to be released and create PR with that in the name
        id: create_pr
        run: | 
          echo 'Get version to be released and create PR with that in the name'
          system_file="$(git rev-parse --show-toplevel)/packages/web/lib/fog/system.class.php"
          tag=$(grep "define('FOG_VERSION'" $system_file | sed "s/.*FOG_VERSION', '\([^']*\)');/\1/")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          prevTag=$(gh release view --json tagName --jq '.tagName')
          echo "prevTag=$prevTag" >> "$GITHUB_OUTPUT"
          # prevTag=$(gh release view --repo FOGProject/fogproject stable --json tagName --jq '.tagName')
          echo "Tag: $tag"
          echo "Previous Tag: $prevTag"
          if [[ "$tag" == "$prevTag" ]]; then
            echo "Not a new version. Exiting nothing to do"
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
            gh pr create -R FOGProject/fogproject -B stable -H dev-branch --title "Stable Release PR For ${tag} - $(date '+%Y-%m-%d')" --body "Pull Request for creating the latest stable release from staged security fixes, bug fixes, and minor enhancements in dev-branch. Created as needed or monthly on 11th of every month (queued in gh actions at 11:11 UTC), released once tests are passing"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  no-release-needed:
    needs: create-release-pull-request
    if: needs.create-release-pull-request.outputs.skip_release == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Announce no release on Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: "Hey @everyone, Nothing to release. PR not created, latest remains ${{ needs.create-release-pull-request.outputs.previous_tag }}."
          title: "No changes - no release"
          color: 0xffe135

  run-install-tests:
    needs: create-release-pull-request
    if: needs.create-release-pull-request.outputs.skip_release != 'true'
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ needs.create-release-pull-request.outputs.release_tag }}
      previous_tag: ${{ needs.create-release-pull-request.outputs.previous_tag }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fog-workflows"

      - name: Call main workflow that calls all the distros
        run: gh workflow run run_all_distros.yml
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  check-all-tests-completed-successfully:
    needs: run-install-tests
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ needs.run-install-tests.outputs.release_tag }}
      previous_tag: ${{ needs.run-install-tests.outputs.previous_tag }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fog-workflows"

      - name: Wait a minute for the runs to start
        run: sleep 60

      - name: Get run IDs
        run: |
          run_id=$(gh run list --workflow run_all_distros.yml --json databaseId --limit 1 | jq -r '.[0].databaseId')
          echo "RUN_ID=$run_id" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Check if distro workflow passed or failed
        run: |
          run_status=""
          while [[ $run_status != "success" && $run_status != "failure" ]]; do
            sleep 15
            run_status=$(gh run view ${{ env.RUN_ID }} --exit-status --json conclusion | jq -r '.conclusion')
          done

          if [[ $run_status == "failure" ]]; then
            exit 1
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  merge-after-all-tests-passed:
    needs: check-all-tests-completed-successfully
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ needs.check-all-tests-completed-successfully.outputs.release_tag }}
      previous_tag: ${{ needs.check-all-tests-completed-successfully.outputs.previous_tag }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
            client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
            private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
            owner: FOGProject
            repositories: "fogproject"

      - name: Checkout Stable
        uses: actions/checkout@v7
        with: 
            token: ${{ steps.app-token.outputs.token }}
            repository: FOGProject/fogproject
            ref: stable
            persist-credentials: false

      - name: Merge the PR
        run: |
            echo "merge the pull request bringing dev-branch into stable";
            tag=${{ needs.check-all-tests-completed-successfully.outputs.release_tag }}
            gh pr merge dev-branch --merge --subject "Stable Release - ${tag}";
        env:
            GH_TOKEN: ${{ steps.app-token.outputs.token }}

  close-pr-if-tests-fail:
    needs: check-all-tests-completed-successfully
    runs-on: ubuntu-24.04
    if: failure()

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
            client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
            private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
            owner: FOGProject
            repositories: "fogproject"

      - name: Checkout Stable
        uses: actions/checkout@v7
        with: 
            token: ${{ steps.app-token.outputs.token }}
            repository: FOGProject/fogproject
            ref: stable
            persist-credentials: false

      - name: Get PR number
        run: |
           pr_number=$(gh pr list --search "is:open Stable Release PR For* in:title" --repo FOGProject/fogproject --json title,number --jq '.[] | select(.title | test("Stable Release PR For*"; "i")) | .number')
           echo "PR_NUMBER=$pr_number" >> $GITHUB_ENV
        env:
            GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Close PR
        run: |
          closure_message="Closing PR due to failure in tests"
          PrNum=${{ env.PR_NUMBER }}
          gh pr close $PrNum --comment "$closure_message" --repo FOGProject/fogproject
        env:
            GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Announce error on Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: "Hey @everyone, validation tests failed. PR ${{ env.PR_NUMBER }} closed. Release ${{ needs.check-all-tests-completed-successfully.outputs.release_tag }} NOT CREATED, latest remains ${{ needs.check-all-tests-completed-successfully.outputs.previous_tag }}. Please check the logs for details."
          title: Validation tests
          status: ${{ needs.check-all-tests-completed-successfully.result }}
          color: 0xff0000

  tag-and-release:
    needs: merge-after-all-tests-passed
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ needs.merge-after-all-tests-passed.outputs.release_tag }}
      previous_tag: ${{ needs.merge-after-all-tests-passed.outputs.previous_tag }}

    steps:
    - uses: actions/create-github-app-token@v3
      id: app-token
      with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

    - name: Checkout Stable
      uses: actions/checkout@v7
      with:
          token: ${{ steps.app-token.outputs.token }}
          repository: FOGProject/fogproject
          ref: stable
          # Fetch full history and tags so the previous release tag resolves for git log
          fetch-depth: 0
          persist-credentials: false

    - name: Initialize Release Environment Variables
      run: |
        echo "TAG=${{ needs.merge-after-all-tests-passed.outputs.release_tag }}" >> $GITHUB_ENV
        echo "PREV_TAG=${{ needs.merge-after-all-tests-passed.outputs.previous_tag }}" >> $GITHUB_ENV
        echo "NOTES_FILE=$RUNNER_TEMP/release_body.md" >> $GITHUB_ENV

    - name: Generate Base PR Notes
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          /repos/FOGProject/fogproject/releases/generate-notes \
          -f tag_name="$TAG" \
          -f previous_tag_name="$PREV_TAG" \
          -f target_commitish="stable" \
          -q .body > "$NOTES_FILE"
          
        # Adding || true ensures sed doesn't crash the script if no matches are found
        sed -i "s/## What's Changed/## Pull Requests/" "$NOTES_FILE" || true
        sed -i "/^\* .*${PREV_TAG}/Id" "$NOTES_FILE" || true

    - name: Append Commits
      continue-on-error: true
      run: |
        echo "" >> "$NOTES_FILE"
        echo "---" >> "$NOTES_FILE"
        echo "" >> "$NOTES_FILE"
        echo "## Commits" >> "$NOTES_FILE"
        echo "" >> "$NOTES_FILE"
        
        git log ${PREV_TAG}..HEAD --reverse --invert-grep -i --grep="^Stable Release" --grep="^merge stable" --grep="^Merge pull request #" --grep="^chore: fix stale FOG_VERSION/FOG_CHANNEL" --pretty=format:"* %s ([%h](https://github.com/FOGProject/fogproject/commit/%H))" >> "$NOTES_FILE"

    - name: Append Closed Issues
      continue-on-error: true
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        prevDate=$(git log -1 --format=%aI "$PREV_TAG")
        closedIssues=$(gh issue list --repo FOGProject/fogproject \
          --search "is:issue is:closed closed:>=$prevDate" \
          --limit 100 \
          --json number,title,url \
          --jq '.[] | "* \(.title) ([#\(.number)](\(.url)))"')
          
        if [ -n "$closedIssues" ]; then
          echo "" >> "$NOTES_FILE"
          echo "---" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"    
          echo "## Closed Issues Since Last Release" >> "$NOTES_FILE"
          echo "$closedIssues" >> "$NOTES_FILE"
        fi

    - name: Append and Update Security Advisories
      continue-on-error: true
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
          prevDate=$(git log -1 --format=%aI "$PREV_TAG")
          
          gh api /repos/FOGProject/fogproject/security-advisories \
            | jq --arg date "$prevDate" '[.[] | select(.published_at >= $date)]' > "$RUNNER_TEMP/new_advisories.json"
            
          secAdvisories=$(jq -r '.[] | "* \(.summary) ([\(.ghsa_id)](\(.html_url)))"' "$RUNNER_TEMP/new_advisories.json")
          
          if [ -n "$secAdvisories" ]; then
            echo "" >> "$NOTES_FILE"
            echo "---" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"    
            echo "## Security Advisories" >> "$NOTES_FILE"
            echo "$secAdvisories" >> "$NOTES_FILE"
            
            ghsa_ids=$(jq -r '.[] | .ghsa_id' "$RUNNER_TEMP/new_advisories.json")
            
            for ghsa_id in $ghsa_ids; do
              echo "Updating Security Advisory $ghsa_id with patched version >=$TAG..."
              current_vulns=$(gh api /repos/FOGProject/fogproject/security-advisories/"$ghsa_id" --jq '.vulnerabilities')
              
              updated_vulns=$(echo "$current_vulns" | jq --arg new_tag ">=$TAG" 'map(
                if .patched_versions == "" or .patched_versions == null then
                  .patched_versions = $new_tag
                else
                  .patched_versions += ", \($new_tag)"
                end
              )')
              
              echo "{\"vulnerabilities\": $updated_vulns}" > "$RUNNER_TEMP/patch_payload.json"
              
              gh api \
                --method PATCH \
                -H "Accept: application/vnd.github+json" \
                /repos/FOGProject/fogproject/security-advisories/"$ghsa_id" \
                --input "$RUNNER_TEMP/patch_payload.json"
            done
          fi

    - name: Publish Release
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh release create "$TAG" --latest -F "$NOTES_FILE" --target stable --title "$TAG"

    - name: Update stable version badge
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        path="badges/stable.json"
        body=$(jq -n --arg message "$TAG" \
          '{schemaVersion: 1, label: "stable", message: $message, color: "blue", cacheSeconds: 3600}')
        content=$(printf '%s' "$body" | base64 -w0)

        sha=$(gh api "repos/FOGProject/fog-workflows/contents/$path" --jq .sha 2>/dev/null || true)
        if [ -n "$sha" ]; then
          gh api "repos/FOGProject/fog-workflows/contents/$path" -X PUT \
            -f message="chore: update stable version badge" \
            -f content="$content" -f sha="$sha" >/dev/null
        else
          gh api "repos/FOGProject/fog-workflows/contents/$path" -X PUT \
            -f message="chore: add stable version badge" \
            -f content="$content" >/dev/null
        fi

  sync-branches:
    needs: tag-and-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: FOGProject/fogproject
          ref: stable
          persist-credentials: false

      - name: Sync stable into dev-branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.tag-and-release.outputs.release_tag }}
        run: |
          gh pr create -B dev-branch -H stable --title "merge stable - ${TAG} into dev" --body "Pull Request for syncing stable release commit back to dev after a release"
          gh pr merge stable --merge --subject "merge stable - ${TAG} into dev"
  
  discord-success:
    needs: tag-and-release
    runs-on: ubuntu-24.04

    steps:
      - name: Announce success on Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "New release"
          description: Click [here](https://github.com/fogproject/fogproject/releases/tag/${{ needs.tag-and-release.outputs.release_tag }}) to check the ${{ needs.tag-and-release.outputs.release_tag }} release notes.
          color: 0x00ff00
