name: fogproject PR regeneration

# Regenerates fogproject's derived files ON THE PULL REQUEST, before it merges,
# instead of on the base branch afterwards.
#
# Called as a reusable workflow by a stub in fogproject
# (.github/workflows/tests.yml), from a job that `needs:` the test suite. A
# caller job that `uses:` a reusable workflow succeeds only if EVERY job in the
# called workflow succeeded, so `needs: suite` there already means "all current
# tests passed" -- no aggregate gate job is needed inside fogproject-tests.yml,
# and that file keeps its read-only invariant intact.
#
# WHY THIS IS A SEPARATE FILE FROM fogproject-tests.yml
#
# That file's header states an invariant you can check with a grep: no App
# token, no commit, no API call, therefore nothing it can do could trigger
# another run of itself. Adding a gated write job to it would replace a
# property a reviewer can verify in one search with "...except job five, whose
# `if:` you have to read and believe". After the 2026-07-28 runaway, that trade
# is not worth one file's worth of YAML reuse.
#
# ============================================================================
# THIS IS THE FIRST WORKFLOW HERE WHOSE OWN PUSH RAISES THE EVENT THAT RUNS IT
# ============================================================================
#
# Read this section before changing anything below it.
#
# Every other trigger in this repository is safe STRUCTURALLY. A cron tick
# cannot see what was pushed. A direct push is not a PR merge, so it cannot
# raise `pull_request: closed`. That is the argument the top of
# update-lang-fix-psr-and-sync-version.yml makes, and it is why the sweep is
# allowed to push at all.
#
# That argument is NOT available here. This job pushes a commit to the pull
# request's head branch, and that push raises `pull_request: synchronize`,
# which runs this workflow again. The edge is real. It is replaced by a
# termination argument plus two runtime circuit breakers.
#
# TERMINATION
#
#   php-cs-fixer in fix mode is a fixed point: run 1 rewrites files to conform
#   to @PSR2, run 2 over conforming files produces no diff. PHP_CS_FIXER_VERSION
#   is pinned below and MUST match the sweep's pin -- two fixer versions
#   disagree about the same file, and both paths format the same tree.
#
#   update-language.sh is deterministic given a tree. Its own header documents
#   why: --omit-header and --no-location (no POT-Creation-Date, no line
#   numbers) and msgcat --no-wrap --sort-output (order- and
#   gettext-version-independent wrapping -- added after two gettext versions
#   rewrote each other's wrapping forever). runs-on is pinned to the same
#   ubuntu-24.04 image the sweep uses so the two produce byte-identical output
#   and cannot fight across a merge.
#
# So: one contributor push -> run 1 -> at most one bot commit -> run 2 -> the
# staging step finds nothing -> no push, no event. AT MOST ONE EXTRA RUN AND
# EXACTLY ONE BOT COMMIT per contributor push. This is not a loop with a fixed
# point; it is a two-step sequence.
#
# CIRCUIT BREAKERS (because the above is an argument, and arguments about loops
# in this repository get audited later)
#
#   1. "Assert regeneration converged" re-runs both operations after staging
#      and fails the job if a second pass changes anything. That turns any
#      future non-idempotency from "30 commits in 20 minutes" into one red
#      check. It is the highest-value step in this file.
#   2. The commit step refuses to push if the head branch already ends in a bot
#      commit and there is still work to do. That bound holds whether or not
#      the idempotency argument is true, which is the entire point of it.
#
# TWO THINGS THAT LOOK LIKE SIMPLIFICATIONS AND ARE TRAPS
#
#   Pushing with GITHUB_TOKEN instead of the App token. A GITHUB_TOKEN push
#   does not trigger workflows, which sounds like exactly what a loop-averse
#   reader wants. It is a deadlock in waiting: once required status checks are
#   on, checks attach to the head SHA, and a push that produces no run leaves
#   the new SHA with no checks and the PR stuck on "Expected -- waiting for
#   status" forever. The App token is both the convention here and the
#   functional requirement; they happen to agree.
#
#   Adding [skip ci] to the commit message. Same deadlock, same reason.
#
# THE VERSION MATH (only when sync_version is true)
#
# FOG_VERSION is `git rev-list master..HEAD --count` put through
# .githooks/lib/fog-version.sh. Computing it here -- before the merge -- means
# predicting what that count will be AFTER the merge. That prediction is only
# possible because the base branch's ruleset forces two things:
#
#   * branches must be up to date before merging, so base is an ancestor of
#     head and the merge adds no commits from base's side;
#   * the merge method is a merge commit, so the merge adds exactly one.
#
# Let H = count(master..HEAD) as this job finds it. The merge will produce
# H + 1, plus one more for any commit this job itself writes. Measured, not
# assumed: a throwaway repo with base at 2 and head at 4 merged --no-ff to 6
# after CI added one commit.
#
# The `+1` that fog-version.sh's mode 1 already applies is for the commit the
# CALLER is about to write -- it knows nothing about a merge commit. So the
# merge commit needs its own +1, and that is what the empty marker commit in
# the compute step below is for: it makes gitcount read H+1, and then the
# script's own mode logic supplies the second increment. The marker is removed
# with `git reset --soft` immediately afterwards, which preserves the staged
# index (verified). It is not `+2` written out longhand, because the version
# formula lives in fogproject and this repository only ever calls it.
#
# WHY local_flag IS STILL COMPUTED THE SAME WAY, AND WHY THAT IS WHAT TERMINATES
#
# The existing contract -- local_flag = 1 iff the regeneration staged something
# -- carries over unchanged, and it is load-bearing for termination:
#
#   regen staged something  -> mode 1 -> drifted forced true, gitcount+1 = H+2.
#                              A commit is definitely being written. Correct.
#   regen staged nothing    -> mode 0 -> honest check against f(H+1).
#                              Not drifted: nothing is written, the merge adds
#                              only itself, and f(H+1) is already right.
#                              Drifted: mode 0 applies its own +1 -> H+2, and a
#                              commit is written. Correct either way.
#
# Now the re-run this job's own push triggers: head carries the commit, so
# H' = H+1, the marker makes gitcount H+2, the regeneration is clean so
# local_flag is 0, and mode 0 compares f(H+2) against the committed value --
# which IS f(H+2), because that is what the previous run wrote. drifted=false,
# nothing staged, no push. The chain stops.
#
# Calling mode 1 unconditionally would instead return f(H+3) on that re-run and
# push forever. Verified against the real script: with the version already
# matching the count, mode 0 returns drifted=false while mode 1 returns the
# next version and drifted=true. Do not "simplify" local_flag to a constant.
#
# WHY THE UP-TO-DATE CHECK IS A RUNTIME GATE AND NOT JUST A RULESET SETTING
#
# The ruleset blocks the MERGE, but this job runs earlier than that, and base
# can move between the two. If it has, H no longer includes base's tip and the
# prediction is wrong -- so the gate skips the version step rather than
# committing a number it cannot stand behind. The contributor has to update the
# branch before they can merge anyway, and that push re-runs this job.
#
# WHY NO RETRY LOOP, UNLIKE THE SWEEP
#
# The sweep needs redo_work() because nothing else would re-fire it. Here, a
# non-fast-forward push means the contributor pushed while we ran -- and their
# push has already raised `synchronize`, so a fresh run against the new tip is
# guaranteed. The event model is the retry. We exit 0 with a notice.

on:
  workflow_call:
    inputs:
      # All optional and resolved against the pull_request event at the use
      # site, the same idiom (and for the same reason -- workflow_call inputs
      # cannot have expression defaults) as fogproject-tests.yml's
      # repository/branch pair. Deliberately NOT named `branch`: this workflow
      # needs three refs with three different roles, and reusing that name for
      # one of them would invite passing the wrong one.
      repository:
        description: "owner/name holding the PR head. Defaults to the event's head repo."
        required: false
        type: string
        default: ''
      head_ref:
        description: "Branch to regenerate and push to. Defaults to the event's head ref."
        required: false
        type: string
        default: ''
      base_ref:
        description: "Branch the PR targets. Scopes the PSR2 pass. Defaults to the event's base ref."
        required: false
        type: string
        default: ''
      sync_version:
        description: "Also compute and commit the post-merge FOG_VERSION/FOG_CHANNEL. Requires the base branch to enforce up-to-date branches and merge commits -- see THE VERSION MATH in this file's header."
        required: false
        type: boolean
        default: false

concurrency:
  # Per pull request, and NOT the sweep's global
  # `fog-generated-sync-and-version` group: that one is cancel-in-progress
  # false, so joining it would queue every PR behind every other PR and behind
  # the daily sweep. (It could not be joined anyway -- concurrency groups are
  # per-repository, and this workflow's group lives in fogproject's namespace
  # when called from there.)
  #
  # cancel-in-progress because a superseded run computed against a tree that no
  # longer exists; the newer run redoes it correctly.
  group: fogproject-pr-regen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  # Everything written below runs on a GitHub App token, so the ambient
  # GITHUB_TOKEN never needs to be writable. Do not raise this to `write`: a
  # reusable workflow's permissions block is a REQUEST, and a caller granting
  # less is a hard startup error with no jobs and no logs -- which is how
  # fogproject's merge stub failed on its first two real merges.
  contents: read

env:
  # MUST match update-lang-fix-psr-and-sync-version.yml. If you bump one, bump
  # the other in the same change.
  PHP_CS_FIXER_VERSION: "3.62.0"

jobs:
  regen:
    name: regenerate generated files
    # Pinned, and the same image the sweep uses, for gettext version parity.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - name: Confirm we resolved a real head branch
        env:
          HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
        run: |
          set -e
          # Fail loud rather than silently regenerating the wrong thing. This is
          # the same lesson fogproject-tests.yml learned when it grew a
          # `repository` input: a checkout that resolves to the wrong place
          # produces a SILENT GREEN, which is worse than a red job.
          if [ -z "$HEAD_REF" ] || [ -z "$BASE_REF" ]; then
            echo "::error::Could not resolve head/base refs. This workflow needs a pull_request event, or explicit head_ref/base_ref inputs."
            exit 1
          fi
          echo "head=$HEAD_REF base=$BASE_REF"

      - name: Check out the pull request HEAD
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The HEAD branch, not github.ref. For a pull_request event github.ref
          # is refs/pull/N/merge -- a detached ref GitHub synthesises for the
          # merge preview, which cannot be pushed to. The test suite WANTS that
          # ref; this job is the one that has to write back, so it checks out
          # the branch the contributor actually owns.
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name }}
          ref: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          # Full history and tags: the PSR2 scope diffs against the merge base,
          # and the version step this gains in phase 2 needs the commit count
          # since master plus `git describe --tags`.
          fetch-depth: 0
          fetch-tags: true
          # Commits and trees, not file contents. fetch-depth:0 makes checkout
          # fetch EVERY branch and tag at full depth
          # (+refs/heads/*:refs/remotes/origin/* +refs/tags/*:refs/tags/*), and
          # fogproject is ~1GB of history across 888 refs. GitHub serves that
          # from a warm pack in about 26 seconds; when the pack has to be
          # rebuilt -- which is exactly what a push to the PR head does, and
          # this job pushes -- the same fetch sits there for minutes. Three
          # consecutive pull requests stalled here on their FIRST regen attempt
          # and completed in 48s on a rerun, which is that cold-pack shape.
          #
          # blob:none keeps every commit, tree and tag, so `git merge-base`
          # below, the commit count since master and `git describe --tags` all
          # still work; only file CONTENT becomes lazy. The working tree is
          # still materialised in full at checkout, so php-cs-fixer and
          # update-language.sh (which walk the filesystem) are unaffected, and
          # the scope step's `diff --name-only` needs no blobs at all.
          #
          # Note the scope step already fetches the one base ref it needs by
          # name, so nothing here depends on the all-branches fetch having
          # happened -- only on the DEPTH.
          filter: blob:none

      - name: Install tooling
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext php-cli
          curl -sSL -o /usr/local/bin/php-cs-fixer \
            "https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/download/v${PHP_CS_FIXER_VERSION}/php-cs-fixer.phar"
          chmod +x /usr/local/bin/php-cs-fixer
          php-cs-fixer --version

      - name: Fetch the plugin tree
        run: |
          set -e
          # packages/web/lib/plugins is gitignored on working-1.6 (the bundled
          # plugins are a pinned fog-plugins release since fogproject#1029), and
          # update-language.sh refuses outright when it is empty -- because
          # xgettext walks the filesystem, and a missing plugin tree silently
          # drops every plugin string from the catalogue (528 msgids when the
          # sweep first measured it). So this is required, not opportunistic.
          #
          # dev-branch and anything cut before #1029 carry the plugins in-tree
          # and ship no fetcher. Those are already correct; leave them alone.
          if [ ! -x bin/fetch-plugins.sh ]; then
            echo "No bin/fetch-plugins.sh on this branch; plugins are in-tree here."
            exit 0
          fi
          bin/fetch-plugins.sh
          if [ -z "$(ls -A packages/web/lib/plugins 2>/dev/null)" ]; then
            echo "::error::packages/web/lib/plugins is empty after fetching."
            exit 1
          fi

      - name: Work out which files this pull request touches
        id: scope
        env:
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
        run: |
          set -e
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

          # THREE dots, via an explicit merge base: changes made ON THIS BRANCH
          # since it diverged, not differences against the base's current tip.
          # Two dots would list files somebody else changed on the base and
          # attribute them to this PR.
          base_sha=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "merge base: $base_sha"

          # core.quotePath=false so non-ASCII names arrive verbatim rather than
          # octal-escaped, matching .githooks/pre-commit. A newline in a
          # filename would still break this; nothing in this repo has one.
          git -c core.quotePath=false diff --name-only --diff-filter=ACMR \
            "$base_sha...HEAD" -- 'packages/web/*.php' \
            ':(exclude)packages/web/vendor/*' > "$RUNNER_TEMP/scope.txt"

          echo "count=$(wc -l < "$RUNNER_TEMP/scope.txt")" >> "$GITHUB_OUTPUT"
          sed 's/^/  /' "$RUNNER_TEMP/scope.txt"

      - name: Apply PSR2 formatting to this pull request's files only
        env:
          # The phar refuses to run as a non-interactive "risky" job otherwise.
          PHP_CS_FIXER_IGNORE_ENV: "1"
        run: |
          set -e
          # SCOPE IS THE ONE PLACE THIS DELIBERATELY DIFFERS FROM THE SWEEP.
          #
          # The sweep formats packages/web wholesale, and says why: it is the
          # backstop that catches whatever a machine without php-cs-fixer
          # committed. It can do that because it owns the branch it pushes to.
          #
          # This push lands in somebody else's pull request. A whole-tree pass
          # here would drag every pre-existing violation in packages/web into
          # their diff, under their name, for them to explain in review -- the
          # exact failure .githooks/pre-commit's psrfix() was rewritten to
          # avoid. So this mirrors the hook's scope instead: the files the
          # change actually touches.
          #
          # The vendor/ exclusion in the scope step is not cosmetic either --
          # reformatting third-party source is what makes a dependency
          # unupdatable, since the next composer install rewrites the files and
          # the fixer rewrites them back.
          if [ ! -s "$RUNNER_TEMP/scope.txt" ]; then
            echo "No PHP files under packages/web changed in this pull request."
            exit 0
          fi
          # ONE INVOCATION PER FILE, deliberately. Do not "optimise" this back
          # into a single batched call:
          #
          #   In ConfigurationResolver.php line 565:
          #     For multiple paths config parameter is required.
          #
          # php-cs-fixer accepts multiple paths on the command line ONLY when
          # --config is also given. So a batched call succeeds on a pull request
          # touching one PHP file and fails instantly on one touching two --
          # which reads as a flaky job rather than a broken one, and cost real
          # red checks on unrelated pull requests before it was tracked down.
          #
          # .githooks/pre-commit's psrfix() loops for the same reason. Matching
          # it is the point.
          #
          # No `|| true`: in fix mode the fixer exits 0 whether or not it
          # changed anything, so a non-zero here is a real failure -- a parse
          # error or a missing extension -- and swallowing it would mean
          # pushing a half-formatted file and reporting success.
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # A rename can leave the old path listed; skip anything absent
            # rather than failing the job on it.
            [ -f "$f" ] || continue
            php-cs-fixer fix "$f" --rules=@PSR2 --quiet
          done < "$RUNNER_TEMP/scope.txt"

      - name: Regenerate translation template
        id: lang
        run: |
          set -e
          # Whole-tree by necessity, not by choice: messages.pot is one global
          # artifact built from a filesystem walk, and there is no per-PR subset
          # of it. It is deterministic, so a current catalogue regenerates to a
          # byte-identical file and stages nothing; if it IS stale this PR
          # absorbs the correction, which is small and strictly better than the
          # sweep doing it later under a message describing something else.
          if [ ! -f .githooks/lib/update-language.sh ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::.githooks/lib/update-language.sh is not on this branch; skipping translation regeneration."
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          sh .githooks/lib/update-language.sh "$PWD"

      - name: Stage regenerated files
        id: regen
        run: |
          set -e
          # Narrow staging, NOT the sweep's `git add -A`. The sweep stages the
          # whole tree because its commit is meant to be a snapshot of a branch
          # it owns. This commit goes into someone's pull request, so it stages
          # only what this job is allowed to touch. The fetched plugin tree is
          # the obvious thing that must never be swept in -- on working-1.6 it
          # is gitignored, but relying on that rather than being explicit is how
          # the wrong file ends up in somebody's PR.
          if [ -d packages/web/management/languages ]; then
            git add -- packages/web/management/languages/
          fi
          if [ -s "$RUNNER_TEMP/scope.txt" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              # A rename can leave the old path listed; skip anything absent
              # rather than failing the job on it.
              [ -f "$f" ] || continue
              git add -- "$f"
            done < "$RUNNER_TEMP/scope.txt"
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Assert regeneration converged
        if: steps.regen.outputs.changed == 'true'
        env:
          LANG_SKIPPED: ${{ steps.lang.outputs.skipped }}
          PHP_CS_FIXER_IGNORE_ENV: "1"
        run: |
          set -e
          # THE CIRCUIT BREAKER. Run both operations a second time over the
          # tree the first pass produced. If anything changes, the operations
          # are not idempotent on this tree, the termination argument at the top
          # of this file is void, and pushing would start a
          # commit/synchronize/commit loop.
          #
          # Fail here instead. One red check is the correct outcome; ~30 commits
          # in 20 minutes was the 2026-07-28 outcome.
          # Per file, for the same reason as the step above.
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -f "$f" ] || continue
            php-cs-fixer fix "$f" --rules=@PSR2 --quiet
          done < "$RUNNER_TEMP/scope.txt"
          if [ "$LANG_SKIPPED" != "true" ]; then
            sh .githooks/lib/update-language.sh "$PWD"
          fi

          if ! git diff --quiet; then
            echo "::error::Regeneration is not idempotent on this tree: a second pass changed files the first pass produced."
            echo "::error::Pushing would start a commit/synchronize loop, so nothing was pushed."
            echo "::error::Check php-cs-fixer and gettext versions against update-lang-fix-psr-and-sync-version.yml."
            git diff --stat
            exit 1
          fi
          echo "Second pass produced no changes; the regeneration is a fixed point."

      - name: Does this branch contain the tip of its base?
        id: uptodate
        if: ${{ inputs.sync_version }}
        env:
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
        run: |
          set -e
          # Already fetched by the scope step, but this must not depend on that
          # step's internals.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

          if git merge-base --is-ancestor "origin/$BASE_REF" HEAD; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HEAD does not contain the tip of $BASE_REF, so the post-merge commit count is not knowable yet. Skipping the version bump -- the ruleset requires an up-to-date branch before this can merge, and that push re-runs this job."
          fi

      - name: Compute the post-merge FOG_VERSION / FOG_CHANNEL
        id: compute
        if: ${{ inputs.sync_version && steps.uptodate.outputs.ok == 'true' }}
        env:
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
          REGEN_CHANGED: ${{ steps.regen.outputs.changed }}
        run: |
          set -e
          # THE BASE branch name, never the head's. fog-version.sh derives
          # branchon/branchend by splitting the name it is given on '-', so:
          #
          #   working-1.6      -> working / 1.6   -> the formula we want
          #   jf/fix-1234      -> matches no case -> silent no-op, drifted=false
          #   feature-anything -> matches feature) -> computes anything.0-feature.N
          #
          # That last one is the real hazard: fogproject contributors do use
          # feature-* branch names, so passing the head would quietly write a
          # plausible-looking and entirely wrong version onto a PR targeting
          # working-1.6. Hardcoding base is not a nicety.
          #
          # The empty marker commit stands in for the MERGE commit -- see THE
          # VERSION MATH at the top of this file. Without it every version
          # written here would be exactly one low, and the merge-time sync would
          # immediately correct it: the churn this whole change exists to remove.
          git -c user.name=marker -c user.email=marker@invalid             commit -q --allow-empty -m "marker: stands in for the merge commit"

          local_flag=0
          [ "$REGEN_CHANGED" = "true" ] && local_flag=1
          echo "local_flag=$local_flag (regen changed: $REGEN_CHANGED)"

          computed=$(sh .githooks/lib/fog-version.sh "$BASE_REF" "$local_flag")

          # Soft, so the staged regeneration survives. Verified: the index is
          # unchanged across --allow-empty + reset --soft.
          git reset -q --soft HEAD~1

          version=$(printf '%s\n' "$computed" | sed -n '1p')
          channel=$(printf '%s\n' "$computed" | sed -n '2p')
          drifted=$(printf '%s\n' "$computed" | sed -n '3p')

          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "channel=$channel"   >> "$GITHUB_OUTPUT"
          echo "drifted=$drifted"   >> "$GITHUB_OUTPUT"
          echo "computed $version ($channel), drifted=$drifted"

      - name: Apply the version fix
        id: version
        if: ${{ steps.compute.outputs.drifted == 'true' }}
        env:
          COMPUTED_VERSION: ${{ steps.compute.outputs.version }}
          COMPUTED_CHANNEL: ${{ steps.compute.outputs.channel }}
        run: |
          set -e
          system_file="packages/web/lib/fog/system.class.php"
          old_version=$(grep "define('FOG_VERSION'" "$system_file" | sed "s/.*FOG_VERSION', '\([^']*\)');/\1/")
          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"

          sh .githooks/lib/apply-fog-version.sh "$COMPUTED_VERSION" "$COMPUTED_CHANNEL"
          git add -- "$system_file"
          echo "$old_version -> $COMPUTED_VERSION ($COMPUTED_CHANNEL)"

      - name: Commit and push to the pull request
        id: commit
        env:
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REGEN_CHANGED: ${{ steps.regen.outputs.changed }}
          COMPUTED_VERSION: ${{ steps.compute.outputs.version }}
          COMPUTED_CHANNEL: ${{ steps.compute.outputs.channel }}
          # Empty unless the version step actually ran, which is what
          # build-the-message below keys off to avoid claiming a version change
          # that did not happen.
          OLD_VERSION: ${{ steps.version.outputs.old_version }}
        run: |
          set -e
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${BOT_SLUG}[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to do: formatting and translations on $HEAD_REF are already current."
            exit 0
          fi

          # Hard bound of one consecutive bot commit. Holds regardless of
          # whether the idempotency argument at the top of this file is true,
          # which is exactly why it is here and not merely a comment.
          if [ "$(git log -1 --format=%an "origin/$HEAD_REF")" = "${BOT_SLUG}[bot]" ]; then
            echo "::error::$HEAD_REF already ends in a ${BOT_SLUG}[bot] commit and this run still found work to do."
            echo "::error::Refusing to stack a second bot commit; that is the shape of the 2026-07-28 runaway."
            echo "::error::Investigate before re-running -- start with the diff below."
            git diff --cached --stat
            exit 1
          fi

          suffix=""
          [ -n "$PR_NUMBER" ] && suffix=" (#${PR_NUMBER})"

          # Message vocabulary deliberately matches the sweep's, so `git log`
          # reads the same whichever path made the correction.
          version_changed=false
          if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" != "$COMPUTED_VERSION" ]; then
            version_changed=true
          fi

          if [ "$REGEN_CHANGED" = "true" ] && [ "$version_changed" = "true" ]; then
            msg="Generated Files & Version Sync: regenerate translations/PSR2 formatting and set version to $COMPUTED_VERSION ($COMPUTED_CHANNEL) for merge into ${BASE_REF}${suffix}"
          elif [ "$version_changed" = "true" ]; then
            msg="Version Sync: set version to $COMPUTED_VERSION ($COMPUTED_CHANNEL) for merge into ${BASE_REF}${suffix}"
          elif [ -n "$OLD_VERSION" ] && [ "$REGEN_CHANGED" != "true" ]; then
            # Channel-only drift: fog-version.sh reports drift on a channel
            # change even when the version string is unchanged, so this commit
            # is real even though the number did not move.
            msg="Version Sync: correct FOG_CHANNEL to $COMPUTED_CHANNEL for merge into ${BASE_REF}${suffix}"
          else
            msg="Generated Files Sync: regenerate translations and PSR2 formatting${suffix}"
          fi

          git commit -q -m "$msg"

          if git push origin "HEAD:$HEAD_REF"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Not a failure -- see "WHY NO RETRY LOOP" at the top of this file.
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$HEAD_REF moved while this run was working; the run that push started will redo this."

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Generated file regeneration"
            echo ""
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "🔧 Pushed one correction commit to \`${{ inputs.head_ref || github.event.pull_request.head.ref }}\` (${{ steps.scope.outputs.count }} PHP file(s) in scope)."
              echo ""
              echo "That push re-runs the suite once against the corrected commit. The re-run makes no further changes -- both operations are idempotent, and the \"Assert regeneration converged\" step above proved it on this tree -- so the chain stops there."
            elif [ "${{ steps.commit.outputs.changed }}" = "false" ]; then
              echo "✅ Nothing to correct; formatting and translations were already current."
            else
              echo "⚠️ Did not reach the commit step -- see the failing step above."
            fi
            if [ "${{ steps.lang.outputs.skipped }}" = "true" ]; then
              echo ""
              echo "ℹ️ Translation regeneration was skipped -- this branch predates \`.githooks/lib/update-language.sh\`. PSR2 formatting still ran."
            fi
            if [ "${{ inputs.sync_version }}" = "true" ]; then
              echo ""
              if [ "${{ steps.uptodate.outputs.ok }}" != "true" ]; then
                echo "⏭️ Version not computed: this branch does not yet contain the tip of \`${{ inputs.base_ref || github.event.pull_request.base.ref }}\`, so the post-merge commit count is not knowable. Update the branch -- which is required before merging anyway -- and this recomputes."
              elif [ "${{ steps.compute.outputs.drifted }}" = "true" ]; then
                echo "🔧 Version set to \`${{ steps.compute.outputs.version }}\` (channel: ${{ steps.compute.outputs.channel }}) -- the value this branch will carry once its merge commit lands."
              else
                echo "✅ Version already correct for the post-merge count -- \`${{ steps.compute.outputs.version }}\`."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
