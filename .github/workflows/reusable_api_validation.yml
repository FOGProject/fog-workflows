name: "Reusable API Validation"

# Stands up a throwaway FOG server and exercises its REST API.
#
# The distro workflows next door prove installfog.sh exits 0, which is a real
# check -- the installer verifies its own web tier and schema deploy before it
# returns. What none of them do is call the API afterwards, so nothing has ever
# tested the surface that clients actually use.
#
# The container is created exactly the way reusable_distro_workflow.yml creates
# it, crun bootstrap and all, because that recipe is load-bearing and distrobox
# fails silently without it. What is new here is everything after the install:
# seeding API credentials, then calling the API with them.
#
# Runs against an arbitrary repo and ref rather than a hardcoded dev-branch, so
# it can validate a pull request before it merges.
#
# Note on tokens, because it is the easy thing to get wrong: globalSettings
# holds the API token RAW. The web UI shows base64_encode() of it, and
# Route::_testToken() base64_decodes whatever arrives in the header. So a
# client copying from the UI sends the value verbatim, but anything reading
# the database -- this workflow -- has to encode it first.

on:
  workflow_call:
    inputs:
      repo:
        description: "owner/name of the FOG repo to install"
        required: false
        default: "FOGProject/fogproject"
        type: string
      ref:
        description: "branch or tag to install"
        required: false
        default: "working-1.6"
        type: string
      distro:
        required: false
        default: "docker.io/library/ubuntu:24.04"
        type: string
      package_man:
        required: false
        default: "apt"
        type: string
      additional_packages:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/name of the FOG repo to install"
        required: false
        default: "FOGProject/fogproject"
        type: string
      ref:
        description: "branch or tag to install"
        required: false
        default: "working-1.6"
        type: string
      distro:
        required: false
        default: "docker.io/library/ubuntu:24.04"
        type: string
      package_man:
        required: false
        default: "apt"
        type: string
      additional_packages:
        required: false
        type: string
  # Self-test: a change to this file proves itself before it is merged,
  # since workflow_dispatch only becomes available once it reaches main.
  pull_request:
    paths:
      - '.github/workflows/reusable_api_validation.yml'

defaults:
  run:
    shell: bash

jobs:
  api-validation:
    runs-on: ubuntu-24.04
    # An install pulls apache, php-fpm, mysql, tftp, nfs and the kernels, so
    # it is slow but not unbounded. Without this the job would sit on the
    # 360 minute default.
    timeout-minutes: 60

    steps:
      - name: Resolve inputs
        # inputs is null on pull_request, so every value needs a fallback.
        run: |
          echo "FOG_REPO=${{ inputs.repo || 'FOGProject/fogproject' }}" >> $GITHUB_ENV
          echo "FOG_REF=${{ inputs.ref || 'working-1.6' }}" >> $GITHUB_ENV
          echo "FOG_DISTRO=${{ inputs.distro || 'docker.io/library/ubuntu:24.04' }}" >> $GITHUB_ENV
          echo "FOG_PKGMAN=${{ inputs.package_man || 'apt' }}" >> $GITHUB_ENV

      - name: Ensure crun is new enough for distrobox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          which crun || echo "crun not found on PATH yet"

          set +e
          CURRENT=$(crun --version 2>/dev/null | head -1 | grep -oP '\d+\.\d+\.\d+')
          set -e
          echo "Current crun: ${CURRENT:-none found}"

          NEED_UPGRADE=1
          if [ -n "$CURRENT" ] && dpkg --compare-versions "$CURRENT" ge "1.14.3"; then
            NEED_UPGRADE=0
          fi

          if [ "$NEED_UPGRADE" = "1" ]; then
            echo "not a new enough crun, pulling latest release from GitHub..."

            RELEASE_JSON=$(curl -sSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/containers/crun/releases/latest)

            if echo "$RELEASE_JSON" | jq -e '.message' >/dev/null 2>&1; then
              echo "GitHub API call failed: $(echo "$RELEASE_JSON" | jq -r '.message')"
              echo "Falling back to pinned known-good crun release."
              DOWNLOAD_URL="https://github.com/containers/crun/releases/download/1.28/crun-1.28-linux-amd64"
            else
              DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "crun-'"$(echo "$RELEASE_JSON" | jq -r .tag_name)"'-linux-amd64") | .browser_download_url')
              if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
                echo "Couldn't find a matching linux-amd64 asset in the release, falling back to pinned version."
                DOWNLOAD_URL="https://github.com/containers/crun/releases/download/1.28/crun-1.28-linux-amd64"
              fi
            fi

            echo "Downloading crun from: $DOWNLOAD_URL"
            curl -sSL -f -o /tmp/crun "$DOWNLOAD_URL"
            chmod +x /tmp/crun

            if ! /tmp/crun --version >/dev/null 2>&1; then
              echo "Downloaded crun binary is broken, aborting."
              exit 1
            fi

            sudo mv /tmp/crun "$(command -v crun)"
          fi

          echo "Final crun binary location: $(which crun)"
          echo "Final crun version: $(crun --version | head -1)"

      - name: Make container name
        run: |
          distro_name_and_ver=$(echo "$FOG_DISTRO" | awk -F '/' '{print $NF}')
          container_name=${distro_name_and_ver/:/_}
          echo "CONTAINER_NAME=$container_name" >> $GITHUB_ENV

      - name: Work out extra packages
        run: |
          if [[ "$FOG_PKGMAN" == "apt" ]]; then
            echo "ADDITIONAL_PKG=libpam-systemd" >> $GITHUB_ENV
            echo "UPDATE_COMMAND=apt update && apt upgrade -y" >> $GITHUB_ENV
          else
            echo "ADDITIONAL_PKG=" >> $GITHUB_ENV
            echo "UPDATE_COMMAND=dnf update -y" >> $GITHUB_ENV
          fi

      - name: Add additional packages if passed as an input
        if: ${{ inputs.additional_packages }}
        run: echo "ADDITIONAL_PKG=$ADDITIONAL_PKG ${{ inputs.additional_packages }}" >> $GITHUB_ENV

      - name: Install Distrobox
        run: curl -s https://raw.githubusercontent.com/89luca89/distrobox/main/install | sudo sh

      - name: Create Distrobox
        run: |
          distrobox create --name $CONTAINER_NAME --image "$FOG_DISTRO" \
            --additional-packages "git systemd $FOG_PKGMAN sudo $ADDITIONAL_PKG" \
            --init-hooks "$UPDATE_COMMAND" \
            --init --pull --root --unshare-all \
            --absolutely-disable-root-password-i-am-really-positively-sure

      - name: Clone FOG
        run: |
          echo "Installing $FOG_REPO @ $FOG_REF"
          distrobox enter --root $CONTAINER_NAME -- \
            git clone -b "$FOG_REF" "https://github.com/${FOG_REPO}.git" fogproject

      - name: Install FOG
        run: distrobox enter --root $CONTAINER_NAME -- bash -c 'sudo ./fogproject/bin/installfog.sh -y'

      - name: Seed API credentials
        # Scripts go in base64 encoded rather than as a quoted -c string. The
        # SQL alone has three levels of quoting and distrobox adds a fourth;
        # encoding sidesteps the lot.
        run: |
          cat > /tmp/seed.sh <<'SEED'
          set -euo pipefail
          . /opt/fog/.fogsettings

          MYSQLDB="${mysqldbname:-fog}"
          MYSQLUSER="${snmysqluser:-fogmaster}"
          HOSTOPT=""
          if [ -n "${snmysqlhost:-}" ] && [ "${snmysqlhost}" != "localhost" ] && [ "${snmysqlhost}" != "127.0.0.1" ]; then
            HOSTOPT="--host=${snmysqlhost}"
          fi
          myq() { mysql $HOSTOPT -s -N --user="$MYSQLUSER" --password="${snmysqlpass}" "$MYSQLDB" -e "$1"; }

          # 1.6 seeds this on, dev-branch seeds it off. Upsert so either works.
          myq "INSERT INTO globalSettings (settingKey,settingDesc,settingValue,settingCategory)
               VALUES ('FOG_API_ENABLED','Enables API Access','1','API System')
               ON DUPLICATE KEY UPDATE settingValue='1';"

          # users.uAPIToken is never seeded by the schema, so the fog user has
          # no personal token until the UI generates one. Write one directly.
          USERTOKEN=$(head -c 48 /dev/urandom | od -An -tx1 | tr -d ' \n')
          myq "UPDATE users SET uAPIToken='${USERTOKEN}', uAllowAPI='1' WHERE uName='fog';"

          APITOKEN=$(myq "SELECT settingValue FROM globalSettings WHERE settingKey='FOG_API_TOKEN';")

          # The header carries base64 of the raw value; the UI shows the same
          # encoding, which is why a UI-copied token is sent verbatim.
          b64() { printf %s "$1" | openssl base64 -A; }

          {
            echo "FOG_API_TOKEN_B64=$(b64 "$APITOKEN")"
            echo "FOG_USER_TOKEN_B64=$(b64 "$USERTOKEN")"
            echo "FOG_BASE_URL=${httpproto:-https}://${ipaddress}${webroot:-/fog/}"
          } > /tmp/apienv

          echo "Seeded. Base URL: ${httpproto:-https}://${ipaddress}${webroot:-/fog/}"
          SEED
          B64=$(base64 -w0 /tmp/seed.sh)
          distrobox enter --root $CONTAINER_NAME -- \
            sudo bash -c "echo $B64 | base64 -d > /tmp/seed.sh && bash /tmp/seed.sh"

      - name: Validate the API
        run: |
          cat > /tmp/test.sh <<'TEST'
          set -uo pipefail
          . /tmp/apienv

          command -v jq >/dev/null 2>&1 || {
            (apt-get install -y jq || dnf install -y jq) >/dev/null 2>&1 || true; }

          PASS=0; FAIL=0
          ok(){ PASS=$((PASS+1)); echo "  PASS  $1"; }
          no(){ FAIL=$((FAIL+1)); echo "  FAIL  $1"; }

          # -k because the installer's default cert is self-signed.
          get(){ curl -sk --max-time 30 -w '\n%{http_code}' "$@"; }
          AUTH=(-H "fog-api-token: ${FOG_API_TOKEN_B64}" -H "fog-user-token: ${FOG_USER_TOKEN_B64}")

          echo "=== unauthenticated ==="
          BODY=$(get "${FOG_BASE_URL}system/info"); CODE=$(echo "$BODY" | tail -1)
          [ "$CODE" = "200" ] && ok "system/info 200" || no "system/info returned $CODE"

          echo "=== token auth ==="
          BODY=$(get "${AUTH[@]}" "${FOG_BASE_URL}host"); CODE=$(echo "$BODY" | tail -1)
          [ "$CODE" = "200" ] && ok "host list 200 with tokens" || no "host list returned $CODE"

          BODY=$(get "${FOG_BASE_URL}host"); CODE=$(echo "$BODY" | tail -1)
          [ "$CODE" = "403" ] && ok "host list refused without tokens" \
            || no "host list without tokens returned $CODE, expected 403"

          echo "=== openapi document ==="
          for PATHPART in system/openapi swagger.json; do
            RESP=$(get "${FOG_BASE_URL}${PATHPART}")
            CODE=$(echo "$RESP" | tail -1)
            DOC=$(echo "$RESP" | sed '$d')
            if [ "$CODE" != "200" ]; then
              no "${PATHPART} returned $CODE"
              continue
            fi
            ok "${PATHPART} 200"
            echo "$DOC" | jq -e . >/dev/null 2>&1 && ok "${PATHPART} is valid json" \
              || { no "${PATHPART} is not valid json"; continue; }
            V=$(echo "$DOC" | jq -r '.openapi // empty')
            [ -n "$V" ] && ok "${PATHPART} declares openapi $V" || no "${PATHPART} has no openapi version"
            NP=$(echo "$DOC" | jq '.paths | length')
            NS=$(echo "$DOC" | jq '.components.schemas | length')
            echo "      ${PATHPART}: $NP paths, $NS schemas"
            # The whole point of generating from live metadata: every valid
            # class should have resolved. A handful means getClass() failed
            # for most of them and the document is quietly near-empty.
            [ "$NP" -gt 300 ] && ok "${PATHPART} has $NP paths (>300)" \
              || no "${PATHPART} only has $NP paths - model classes likely failed to resolve"
            [ "$NS" -gt 40 ] && ok "${PATHPART} has $NS schemas (>40)" \
              || no "${PATHPART} only has $NS schemas"
          done

          A=$(get "${FOG_BASE_URL}system/openapi" | sed '$d' | jq -S . 2>/dev/null | md5sum)
          B=$(get "${FOG_BASE_URL}swagger.json"   | sed '$d' | jq -S . 2>/dev/null | md5sum)
          [ "$A" = "$B" ] && ok "both paths serve the same document" \
            || no "system/openapi and swagger.json differ"

          echo ""
          echo "PASSED: $PASS   FAILED: $FAIL"
          [ "$FAIL" -eq 0 ]
          TEST
          B64=$(base64 -w0 /tmp/test.sh)
          distrobox enter --root $CONTAINER_NAME -- \
            sudo bash -c "echo $B64 | base64 -d > /tmp/test.sh && bash /tmp/test.sh"

      - name: Can the runner reach the server directly?
        # Not an assertion, a probe. The container is --unshare-all so it has
        # its own netns; whether the runner can reach it decides if a future
        # job could run a client (FogApi's real-server suite, say) from the
        # runner rather than installing one inside the container.
        if: always()
        continue-on-error: true
        run: |
          IP=$(sudo podman inspect "$CONTAINER_NAME" \
            --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null || true)
          echo "container ip: ${IP:-unknown}"
          if [ -n "$IP" ] && curl -sk --max-time 15 -o /dev/null -w '%{http_code}\n' "https://${IP}/fog/system/info"; then
            echo "runner CAN reach the container -- a client can run on the runner"
          else
            echo "runner CANNOT reach the container -- clients must run inside it"
          fi

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          for f in /var/log/foginstall.log /home/fogproject/error_logs/fog_error_*.log; do
            distrobox enter --root $CONTAINER_NAME -- sudo bash -c "cat $f" > "logs/$(basename $f 2>/dev/null || echo install).log" 2>/dev/null || true
          done
          distrobox enter --root $CONTAINER_NAME -- sudo bash -c 'cat /opt/fog/.fogsettings' \
            | grep -v -i 'pass' > logs/fogsettings-redacted.txt 2>/dev/null || true
          ls -la logs/ || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-validation-logs-${{ env.CONTAINER_NAME }}
          path: logs/
          if-no-files-found: warn
