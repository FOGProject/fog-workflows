name: Update Language Files, Fix PSR2, and Sync FOG Version

# Daily sweep across all watched fogproject branches that keeps three
# generated/derived things in sync: gettext translations, PSR2 formatting,
# and FOG_VERSION/FOG_CHANNEL - all three as ONE job, one commit, one push
# per branch, in that order, because the third depends on the first two
# having already landed.
#
# WHAT STILL COMES HERE, NOW THAT PR-TIME REGENERATION EXISTS
#
# fogproject-pr-regen.yml corrects translations and PSR2 formatting ON the
# pull request, before it merges. That does not shrink this workflow's job,
# because it only covers pull requests that can run it:
#
#   - direct pushes to a watched branch cover nothing;
#   - merged FORK pull requests get no secrets, so no PR-time regeneration;
#   - rc-*/feature-* branches are off the merge path entirely.
#
# All three still land here. What did change is the MERGE path: fogproject's
# sync-generated-files.yml now calls this with version_only, because by the
# time a same-repo PR merges its formatting and catalogue are already correct,
# and redoing them at merge time can only ever be a no-op that still costs a
# plugin fetch and a full gettext regeneration.
#
# WHY THESE THREE ARE ONE WORKFLOW
#
# FOG_VERSION on dev-branch/working-1.6/feature-*/rc-* branches is derived
# from commit count since master (see .githooks/lib/fog-version.sh). A
# translation or PSR2 fixup commit changes that count, so the version
# check has to see it before computing a version, not race it. This used
# to be two workflows on a 30-minute schedule offset (sync at 09:40,
# version check at 10:10) trusting that the gap was enough. It's cleaner
# and race-proof to do it in one job: regenerate/format first, then
# compute the version - using fog-version.sh's own "local" flag (the same
# flag .githooks/pre-commit passes when it's mid-commit) to tell it a new
# commit for the regen changes is about to exist, so the version already
# accounts for it instead of catching up the next day.
#
# Regenerating translations and reformatting centrally also backstops the
# gap fogproject's own .githooks/lib/require-tools.sh documents: a hook
# cannot install anything on a machine it does not control, so
# .githooks/pre-commit's psrfix()/updateLanguage() skip loudly (a warning
# to stderr, commit proceeds anyway) rather than silently or refusing
# outright when php-cs-fixer/gettext aren't installed. This sweep is the
# "CI regenerates it centrally" half of that design, so the tooling stays
# advisory for contributors regardless of what they had installed.
# php-cs-fixer is pinned below (not "latest") because two installed
# versions can disagree about the same file, which would otherwise make
# this job fight itself.
#
# Calls fogproject's own .githooks/lib/update-language.sh for the
# translation regen - the same script .githooks/pre-commit calls locally -
# rather than keeping a second, separately-maintained copy of that logic
# here, for the same reason fog-version.sh/apply-fog-version.sh aren't
# reimplemented either. That script (and require-tools.sh) already exist on
# dev-branch and working-1.6; an rc-*/feature-* branch cut before they
# landed there won't have update-language.sh yet, so the regen step below
# skips it (loudly, via ::warning::) rather than failing the whole job on a
# branch nobody can fix without rebasing.
#
# WHY IT IS A SCHEDULE AND NOT A PUSH TRIGGER
#
# A push-triggered stub living in fogproject and calling a reusable
# workflow here means the bot's own fixup push re-triggers the stub, which
# re-triggers this workflow, which pushes another fixup. That exact loop
# put 30 commits on dev-branch in ~20 minutes before it was caught. A cron
# tick cannot look at what was last pushed, so it cannot feed itself.
#
# IT IS ALSO MERGE-TRIGGERED NOW, AND WHY THAT IS NOT THE SAME MISTAKE
#
# fogproject's .github/workflows/sync-generated-files.yml calls this over
# workflow_call when a PR is merged into working-1.6 or dev-branch. That
# closes a real gap the schedule alone leaves: the pre-commit hook is
# client-side, so a PR merged through GitHub's web UI never runs it and the
# version stays wrong until the next cron tick, up to a day later.
#
# The property that makes it safe is the event, not restraint. That stub
# triggers on `pull_request: types: [closed]`, and the push below is a
# direct push to a branch, not a PR merge -- so the bot cannot raise the
# event that would call it again. The loop is closed by the shape of the
# trigger, the same way a cron tick cannot feed itself, rather than by an
# actor-name guard that has to be kept correct.
#
# It is `pull_request` and not `pull_request_target`, which is worth knowing
# because the latter looks like the better choice: it is the variant that
# gets secrets on a fork PR. It was tried first and never fired once.
# GitHub reads a `pull_request_target` workflow from the repository's
# DEFAULT branch (`stable`), not from the PR's base branch, so a stub living
# on working-1.6/dev-branch is never consulted -- it did not even register
# as a workflow, and four PRs merged without it running. The cost of using
# `pull_request` instead is that a merged FORK PR gets no secrets and is
# therefore skipped by the stub's same-repo guard; the schedule below picks
# those up, exactly as it does direct pushes.
#
# The schedule stays exactly as it is, and is still the only cover for
# direct pushes, for merged fork PRs, and for rc-*/feature-* branches. rc-*
# in particular must NOT be merge-synced: fog-version.sh increments rc off
# the committed suffix rather than a commit count, so it reports drift on
# every run, and a per-merge sync there would bump the RC suffix on every
# merge. The stub's branch allowlist is what keeps rc-* on the schedule.
#
# Never touches `stable` - the branch filter below excludes it, because
# that branch's version and contents are owned by stable-releases.yml.
#
# Runs at 10:10 UTC, just over an hour before stable-releases.yml's
# monthly run (11:11 UTC on the 11th), so a release never reads a stale
# version - or stale translations/formatting - on the day it's cut.
# stable-releases.yml also calls this directly (for dev-branch) before
# opening the release PR, so release day doesn't have to wait for the
# daily schedule either.

on:
  schedule:
    - cron: "10 10 * * *"
  workflow_call:
    inputs:
      branch:
        description: "Single fogproject branch to sync (omit to sweep all watched branches)"
        required: false
        type: string
      version_only:
        description: "Skip translation regeneration and PSR2 formatting; sync only FOG_VERSION/FOG_CHANNEL. Used by fogproject's merge stub now that PR-time regeneration owns the first two."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      branch:
        description: "Single fogproject branch to sync (omit to sweep all watched branches)"
        required: false
        type: string
      version_only:
        description: "Skip translation regeneration and PSR2 formatting; sync only FOG_VERSION/FOG_CHANNEL. Used by fogproject's merge stub now that PR-time regeneration owns the first two."
        required: false
        type: boolean
        default: false

concurrency:
  group: fog-generated-sync-and-version
  cancel-in-progress: false

permissions:
  # `read`, and deliberately not `write`, because nothing here uses the ambient
  # GITHUB_TOKEN any more: the checkout, the commit/push and the version badge
  # all run on GitHub App tokens. What this line really controls now is who can
  # CALL this workflow.
  #
  # A reusable workflow's `permissions:` is a REQUEST, and GitHub refuses the
  # call outright when a caller grants less -- it is a hard startup error, not a
  # silent capping:
  #
  #   The workflow is requesting 'contents: write', but is only allowed
  #   'contents: read'.
  #
  # No jobs run, no logs are produced, and the run just shows "a workflow file
  # issue" -- which is how fogproject's merge stub failed on its first two real
  # merges while asking for the correct, least-privilege `contents: read`.
  #
  # So do not raise this back to `write` to be safe. Raising it forces every
  # caller to grant write for a token none of them use, and breaks at startup
  # any caller that does not. If a step here ever genuinely needs the ambient
  # token, give that step its own App token instead, the way the badge step
  # does.
  contents: read

env:
  # Pinned, not "latest". An unpinned formatter is a second source of drift:
  # 3.x and 4.x disagree about the same file, so an unpinned CI run would
  # reformat whatever the previous run wrote. Bump this deliberately, and
  # expect one large commit when you do.
  PHP_CS_FIXER_VERSION: "3.62.0"

jobs:
  discover-branches:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - name: List watched branches
        id: list
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SINGLE_BRANCH: ${{ inputs.branch }}
        run: |
          set -e
          if [ -n "$SINGLE_BRANCH" ]; then
            branches=$(jq -n --arg branch "$SINGLE_BRANCH" -c '[$branch]')
          else
            all=$(gh api repos/FOGProject/fogproject/branches --paginate --jq '.[].name')
            matched=$(printf '%s\n' "$all" | grep -E '^(working-1\.6|dev-branch)$|^(rc-|feature-)' || true)
            branches=$(printf '%s\n' "$matched" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

          {
            echo "## Watched branches"
            echo ""
            if [ "$branches" = "[]" ]; then
              echo "None found."
            else
              printf '%s\n' "$branches" | jq -r '.[] | "- `\(.)`"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sync-branch:
    needs: discover-branches
    if: needs.discover-branches.outputs.branches != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}

    env:
      # A boolean, not an `operations: all|regen|version` string. workflow_call
      # has no `choice` type, so an enum would be an unvalidated string whose
      # typo mode is "silently perform the wrong subset" -- and this workflow
      # already carries one unvalidated string input (`branch`, which
      # sync-generated-files.yml's comment notes it must constrain itself). A
      # boolean is schema-checked for free. There is also no use for a
      # regen-only mode: that lives in fogproject-pr-regen.yml now.
      #
      # `|| false` because the `inputs` context is empty on a schedule event --
      # input defaults apply to workflow_call/workflow_dispatch only.
      #
      # This exists for fogproject's merge stub. Since PSR2 and the
      # translation catalogue are now corrected on the PR branch BEFORE it
      # merges (fogproject-pr-regen.yml, next door), redoing them at merge time
      # can only ever be a no-op on that path -- while still costing a plugin
      # fetch and a full gettext regeneration on every merge.
      #
      # They are NOT removed from this workflow, and must not be: the schedule
      # is still the only cover for direct pushes, for merged fork PRs (which
      # get no secrets and so no PR-time autofix), and for rc-*/feature-*
      # branches, which are deliberately off the merge path entirely.
      VERSION_ONLY: ${{ inputs.version_only || false }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: FOGProject/fogproject
          ref: ${{ matrix.branch }}
          # Full history and tags: needed for the version compute step
          # below (commit count since master, `git describe --tags`).
          fetch-depth: 0
          fetch-tags: true

      - name: Install tooling
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext php-cli
          curl -sSL -o /usr/local/bin/php-cs-fixer \
            "https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/download/v${PHP_CS_FIXER_VERSION}/php-cs-fixer.phar"
          chmod +x /usr/local/bin/php-cs-fixer
          php-cs-fixer --version

      - name: Fetch the plugin tree
        # Only the translation regeneration needs this, so a version-only run
        # skips the download entirely rather than fetching a release it will
        # not read.
        if: ${{ !fromJSON(env.VERSION_ONLY) }}
        run: |
          set -e
          # Since fogproject#1029 the bundled plugins are a pinned fog-plugins
          # release rather than a tree in the repository, and the regeneration
          # below feeds xgettext from a filesystem walk of packages/web. Without
          # this step the sweep builds a catalogue with every plugin string
          # missing -- 528 msgids when it was first measured, the whole of LDAP,
          # Windows Key and WOL Broadcast among them -- and pushes it.
          #
          # update-language.sh refuses outright when the tree is absent, so the
          # symptom today would be a red job rather than a silent truncation.
          # This is what makes the job pass for the right reason.
          #
          # Conditional: dev-branch, and any branch cut before #1029, still
          # carry the plugins in-tree and ship no fetcher. Those are already
          # correct and must be left alone.
          if [ ! -x bin/fetch-plugins.sh ]; then
            echo "No bin/fetch-plugins.sh on ${{ matrix.branch }}; plugins are in-tree there."
            exit 0
          fi
          bin/fetch-plugins.sh
          # Belt and braces. The fetch verifies its own checksum and fails
          # loudly, but a catalogue is about to be built from this directory and
          # a silently empty one is the failure being designed out.
          if [ -z "$(ls -A packages/web/lib/plugins 2>/dev/null)" ]; then
            echo "::error::packages/web/lib/plugins is empty after fetching on ${{ matrix.branch }}."
            exit 1
          fi

      - name: Regenerate translation template
        id: lang
        if: ${{ !fromJSON(env.VERSION_ONLY) }}
        run: |
          set -e
          # dev-branch and working-1.6 already carry this script; any new
          # feature-*/rc-* branch cut from either afterward will too.
          # Branches cut before that (e.g. feature-198-unique-host-identifier,
          # feature-fog2-gui) won't - loudly skip rather than failing the
          # whole job, but as a visible warning, not a silent notice.
          if [ ! -f .githooks/lib/update-language.sh ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::.githooks/lib/update-language.sh is not on ${{ matrix.branch }} (branch predates it); skipping translation regeneration."
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          sh .githooks/lib/update-language.sh "$PWD"

      - name: Apply PSR2 formatting
        if: ${{ !fromJSON(env.VERSION_ONLY) }}
        env:
          # The phar refuses to run as a non-interactive "risky" job otherwise.
          PHP_CS_FIXER_IGNORE_ENV: "1"
        run: |
          set -e
          # Whole tree, deliberately. The hook fixes only the files staged for
          # a given commit, which is right locally but leaves anything a
          # tool-less machine committed untouched. This is the sweep that
          # catches those.
          #
          # No `|| true`: in fix mode (as opposed to --dry-run) the fixer
          # exits 0 whether or not it changed anything, so a non-zero here is
          # a real failure - a parse error or a missing extension - and
          # swallowing it would mean committing a half-formatted tree and
          # reporting success.
          php-cs-fixer fix packages/web --rules=@PSR2 --quiet

      - name: Stage generated file changes
        id: regen
        run: |
          set -e
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Compute FOG_VERSION / FOG_CHANNEL
        id: compute
        run: |
          set -e
          # local=1 when the regen step above just staged a real change:
          # that's about to become a real commit, so fog-version.sh needs
          # to count it even though it isn't committed yet - the same
          # "mid-commit" flag .githooks/pre-commit passes for the same
          # reason. local=0 (today's plain drift check) when there's
          # nothing pending.
          local_flag=0
          [ "${{ steps.regen.outputs.changed }}" = "true" ] && local_flag=1
          computed=$(sh .githooks/lib/fog-version.sh "${{ matrix.branch }}" "$local_flag")
          echo "version=$(printf '%s\n' "$computed" | sed -n '1p')" >> "$GITHUB_OUTPUT"
          echo "channel=$(printf '%s\n' "$computed" | sed -n '2p')" >> "$GITHUB_OUTPUT"
          echo "drifted=$(printf '%s\n' "$computed" | sed -n '3p')" >> "$GITHUB_OUTPUT"

      - name: Apply version fix
        id: version
        if: steps.compute.outputs.drifted == 'true'
        run: |
          set -e
          system_file="packages/web/lib/fog/system.class.php"
          old_version=$(grep "define('FOG_VERSION'" "$system_file" | sed "s/.*FOG_VERSION', '\([^']*\)');/\1/")
          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"

          sh .githooks/lib/apply-fog-version.sh \
            "${{ steps.compute.outputs.version }}" \
            "${{ steps.compute.outputs.channel }}"

          git add "$system_file"

      - name: Commit and push if stale
        id: commit
        env:
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ matrix.branch }}
          REGEN_CHANGED: ${{ steps.regen.outputs.changed }}
          COMPUTED_VERSION: ${{ steps.compute.outputs.version }}
          COMPUTED_CHANNEL: ${{ steps.compute.outputs.channel }}
          OLD_VERSION: ${{ steps.version.outputs.old_version }}
          LANG_SKIPPED: ${{ steps.lang.outputs.skipped }}
          # php-cs-fixer refuses to run as a non-interactive "risky" job
          # otherwise. Needed here as well as in the step above because the
          # retry path below re-runs it.
          PHP_CS_FIXER_IGNORE_ENV: "1"
          # Three total attempts, not unbounded. Each retry is a full rebuild
          # (see redo_work), so a branch being merged into faster than this job
          # can regenerate is a signal to stand down and let the cron sweep have
          # it, not to spin.
          MAX_ATTEMPTS: "3"
        run: |
          set -e
          system_file="packages/web/lib/fog/system.class.php"

          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${BOT_SLUG}[bot]@users.noreply.github.com"

          # Rebuilds the entire answer from scratch against the branch as it now
          # stands on the remote. This is what makes a retry safe AND correct,
          # and it is the reason the push below retries rather than skipping.
          #
          # WHY HARD RESET, NOT REBASE OR SOFT RESET
          #
          # The commit this job makes is a snapshot: the staging step runs
          # `git add -A`, so it covers every file in the tree as it looked on
          # the OLD base. Re-parenting that snapshot onto the merge that just
          # landed -- by soft reset, or by rebasing and taking our side of the
          # conflict -- would REVERT that merge's changes to every file the
          # snapshot happens to contain. That is silent data loss dressed up as
          # a retry, and it is why the original code chose to skip instead.
          #
          # Discarding the work and redoing it removes the whole class of
          # problem: regeneration is deterministic given a tree, so running it
          # again on the new tree produces the right answer with nothing carried
          # over. The version is recomputed too -- it is a pure function of
          # branch state, so the number that was stale the moment the remote
          # moved is simply computed again against where the remote is now.
          # That distinction is the point of the fix: rebase-and-retry pushes a
          # number that is already wrong, recompute-and-retry does not.
          redo_work() {
              git reset --hard "origin/$BRANCH"

              # The retry has to honour VERSION_ONLY too. Without this a
              # version-only run that lost a push race would quietly reintroduce
              # the regeneration it was explicitly told to skip -- on its second
              # attempt, where nobody would look for it.
              if [ "$VERSION_ONLY" != "true" ]; then
                  # Same guard as the "Regenerate translation template" step: an
                  # rc-*/feature-* branch cut before update-language.sh landed
                  # does not have it. That step already warned; stay silent here.
                  if [ "$LANG_SKIPPED" != "true" ]; then
                      sh .githooks/lib/update-language.sh "$PWD"
                  fi
                  php-cs-fixer fix packages/web --rules=@PSR2 --quiet
              fi

              git add -A
              if git diff --cached --quiet; then
                  REGEN_CHANGED=false
              else
                  REGEN_CHANGED=true
              fi

              local_flag=0
              [ "$REGEN_CHANGED" = "true" ] && local_flag=1
              computed=$(sh .githooks/lib/fog-version.sh "$BRANCH" "$local_flag")
              COMPUTED_VERSION=$(printf '%s\n' "$computed" | sed -n '1p')
              COMPUTED_CHANNEL=$(printf '%s\n' "$computed" | sed -n '2p')
              drifted=$(printf '%s\n' "$computed" | sed -n '3p')

              # Cleared, not carried. The winning merge may have brought the
              # branch to the correct version by itself, in which case there is
              # no version change to report and the message must not claim one.
              OLD_VERSION=""
              if [ "$drifted" = "true" ]; then
                  OLD_VERSION=$(grep "define('FOG_VERSION'" "$system_file" | sed "s/.*FOG_VERSION', '\([^']*\)');/\1/")
                  sh .githooks/lib/apply-fog-version.sh "$COMPUTED_VERSION" "$COMPUTED_CHANNEL"
                  git add "$system_file"
              fi
          }

          # A function rather than inline, because the retry path needs the same
          # message built from recomputed values.
          build_message() {
              version_changed=false
              if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" != "$COMPUTED_VERSION" ]; then
                  version_changed=true
              fi

              # With version_only the first and last shapes cannot
              # occur: nothing regenerates, so REGEN_CHANGED is false, and a run
              # with no version change stages nothing and returns before this is
              # ever called. Stated so the message can never claim a
              # regeneration that was switched off.
              if [ "$VERSION_ONLY" != "true" ] && [ "$REGEN_CHANGED" = "true" ] && [ "$version_changed" = "true" ]; then
                  printf '%s' "Generated Files & Version Sync: regenerate translations/PSR2 formatting and bump version from $OLD_VERSION to $COMPUTED_VERSION ($COMPUTED_CHANNEL) on $BRANCH"
              elif [ "$version_changed" = "true" ]; then
                  printf '%s' "Version Sync: Increment version from $OLD_VERSION to $COMPUTED_VERSION for $COMPUTED_CHANNEL channel on $BRANCH to match commit count since master"
              elif [ "$REGEN_CHANGED" != "true" ]; then
                  # Channel-only drift. fog-version.sh sets drifted=true when
                  # the CHANNEL differs even if the version string does not, so
                  # OLD_VERSION can equal COMPUTED_VERSION while system.class.php
                  # still has a staged change. Without this shape that commit
                  # went out claiming to "regenerate translations and PSR2
                  # formatting" -- describing work it did not contain.
                  #
                  # Reachable before this change, just rare. version_only makes
                  # it the common case rather than a corner, which is why it is
                  # fixed here.
                  printf '%s' "Version Sync: correct FOG_CHANNEL to $COMPUTED_CHANNEL on $BRANCH"
              else
                  printf '%s' "Generated Files Sync: regenerate translations and PSR2 formatting on $BRANCH"
              fi
          }

          attempt=1
          while :; do
            # Checked at the top of every pass, not just the first: a retry that
            # rebuilds onto a branch somebody else already corrected finds
            # nothing staged, and that is success, not a failure to push.
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
              echo "Nothing to do on $BRANCH (attempt $attempt)."
              exit 0
            fi

            git commit -q -m "$(build_message)"

            if git push origin "HEAD:$BRANCH"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
              # The badge and the summary both read the version back out. After
              # a retry the compute step's outputs are stale by exactly the
              # thing this loop exists to fix, so publish what actually landed
              # and let those consumers prefer it.
              echo "final_version=$COMPUTED_VERSION" >> "$GITHUB_OUTPUT"
              echo "final_channel=$COMPUTED_CHANNEL" >> "$GITHUB_OUTPUT"
              echo "final_old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
              [ "$attempt" -gt 1 ] && echo "::notice::Pushed to $BRANCH on attempt $attempt after recomputing against a moved branch."
              exit 0
            fi

            # A non-fast-forward here is not this job failing. It means a PR was
            # merged into this branch during the ~50 seconds spent checking out,
            # installing tooling and regenerating. Measured on the run that took
            # the merge stub down: checkout at 14:11:43, push at 14:12:32, and an
            # unrelated PR merged at 14:12:05. Three of fifteen runs died this
            # way, each within a minute of another run.
            #
            # The fogproject stub's concurrency group already serialises sync
            # runs against each other. Nothing can serialise this against a human
            # pressing Merge -- and cross-repo concurrency does not exist anyway,
            # since groups are per-repository, so that stub and this repo's cron
            # could never share one regardless.
            #
            # HEAD~1 is the commit this pass started from, because the commit
            # above is the only one it makes; if origin/<branch> is no longer
            # that, the branch moved and this is the race. fogproject GH-1219.
            git fetch origin "$BRANCH"
            if [ "$(git rev-parse HEAD~1)" = "$(git rev-parse "origin/$BRANCH")" ]; then
              # The remote is where we left it, so the push failed for some other
              # reason and that is a real failure.
              exit 1
            fi

            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$MAX_ATTEMPTS" ]; then
              # Still a gap, just a much smaller one, and still not a red X --
              # the daily cron is the backstop it always was. Same trade the
              # fogproject stub documents for fork PRs: better a gap the
              # schedule already covers than a failed check on every merge.
              echo "raced=true" >> "$GITHUB_OUTPUT"
              echo "attempts=$MAX_ATTEMPTS" >> "$GITHUB_OUTPUT"
              echo "::warning::$BRANCH moved during each of $MAX_ATTEMPTS attempts, so nothing was pushed. The next merge sync or the daily cron will recompute."
              exit 0
            fi

            echo "$BRANCH moved during attempt $((attempt - 1)); rebuilding against the new tip."
            redo_work
          done

      - uses: actions/create-github-app-token@v3
        id: badge-token
        # Deliberately a second token rather than widening the one above: that
        # one is scoped to fogproject because that is the only repo it pushes
        # to, and this step writes to fog-workflows and nothing else.
        if: contains(fromJson('["dev-branch", "working-1.6"]'), matrix.branch)
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fog-workflows"

      - name: Update version badge
        # Also gated on the push having happened. The badge is a claim about
        # what the branch carries, and when the loop above gives up it carries
        # the OLD version -- publishing the computed one would advertise a
        # version that is not there. Predates the retry loop; the loop just
        # made it easy to see.
        if: >-
          contains(fromJson('["dev-branch", "working-1.6"]'), matrix.branch)
          && steps.commit.outputs.raced != 'true'
        env:
          # Was github.token, which works only while this workflow runs in
          # fog-workflows. Under workflow_call github.token is the CALLER's
          # token, and a GITHUB_TOKEN cannot write to another repository -- so
          # the moment fogproject started calling this on merge, every run
          # 403'd here and failed the job under `set -e`. The App token is what
          # CLAUDE.md asks for on this repo regardless: "don't 'simplify' those
          # back to the default GITHUB_TOKEN just because the call is same-repo."
          GH_TOKEN: ${{ steps.badge-token.outputs.token }}
        run: |
          set -e
          path="badges/${{ matrix.branch }}.json"
          body=$(jq -n \
            --arg label "${{ matrix.branch }}" \
            --arg message "${{ steps.commit.outputs.final_version || steps.compute.outputs.version }}" \
            '{schemaVersion: 1, label: $label, message: $message, color: "blue", cacheSeconds: 3600}')
          content=$(printf '%s' "$body" | base64 -w0)

          sha=$(gh api "repos/FOGProject/fog-workflows/contents/$path" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api "repos/FOGProject/fog-workflows/contents/$path" -X PUT \
              -f message="chore: update ${{ matrix.branch }} version badge" \
              -f content="$content" -f sha="$sha" >/dev/null
          else
            gh api "repos/FOGProject/fog-workflows/contents/$path" -X PUT \
              -f message="chore: add ${{ matrix.branch }} version badge" \
              -f content="$content" >/dev/null
          fi

      - name: Summarize
        if: always()
        run: |
          {
            echo "## \`${{ matrix.branch }}\`"
            echo ""
            if [ "$VERSION_ONLY" = "true" ]; then
              # Not "already current" -- this run never looked. Saying otherwise
              # would report a check that did not happen as a passing one.
              echo "⏭️ Translations and PSR2 not checked on this run (version-only). They are corrected on the pull request before it merges; the daily sweep covers everything else."
            elif [ "${{ steps.regen.outputs.changed }}" = "true" ]; then
              echo "🔧 **Generated files regenerated** - translations and/or PSR2 formatting were stale."
            else
              echo "✅ Generated files already current."
            fi
            if [ "${{ steps.compute.outputs.drifted }}" != "true" ]; then
              echo "✅ Version already correct - \`${{ steps.compute.outputs.version }}\` (channel: ${{ steps.compute.outputs.channel }})"
            elif [ "${{ steps.commit.outputs.changed }}" = "false" ]; then
              # A retry that rebuilt onto a branch somebody else had already
              # corrected finds nothing to stage. Reported separately from
              # "already correct" above, which is about the state this job
              # found, not the state it left.
              echo "✅ Version already correct on \`${{ matrix.branch }}\` by the time this run rebuilt against it."
            elif [ "${{ steps.commit.outputs.raced }}" = "true" ]; then
              # Before the version line, not after it. This branch keys on the
              # PUSH; the one below keys on steps.version.outcome, which is the
              # "Apply version fix" step and succeeds whether or not anything
              # reached the remote. Without this the summary would report
              # "Version fixed" for a version that was skipped, and the
              # steps.commit.outcome check further down would stay quiet
              # because that step now exits 0 on the race. fogproject GH-1219.
              echo "⏭️ Version drift detected, but \`${{ matrix.branch }}\` moved again on every one of ${{ steps.commit.outputs.attempts }} attempts, so nothing was pushed. The next merge sync or the daily cron will recompute."
            elif [ "${{ steps.version.outcome }}" = "success" ]; then
              echo "🔧 **Version fixed** - \`${{ steps.commit.outputs.final_old_version || steps.version.outputs.old_version }}\` → \`${{ steps.commit.outputs.final_version || steps.compute.outputs.version }}\` (channel: ${{ steps.commit.outputs.final_channel || steps.compute.outputs.channel }})"
              if [ "${{ steps.commit.outputs.attempts }}" != "1" ] && [ -n "${{ steps.commit.outputs.attempts }}" ]; then
                echo ""
                echo "🔁 \`${{ matrix.branch }}\` moved mid-run; the value above was recomputed and pushed on attempt ${{ steps.commit.outputs.attempts }}."
              fi
            else
              echo "⚠️ Version drift detected but the fix did not complete - check the job log."
            fi
            if [ "${{ steps.commit.outcome }}" != "success" ]; then
              echo ""
              echo "⚠️ The commit/push step did not complete - check the job log."
            fi
            if [ "${{ steps.lang.outputs.skipped }}" = "true" ]; then
              echo ""
              echo "ℹ️ Translation regeneration was skipped - this branch predates \`.githooks/lib/update-language.sh\`. PSR2 formatting and version sync still ran."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
