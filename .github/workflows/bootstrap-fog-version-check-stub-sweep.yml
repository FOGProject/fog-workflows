name: Sweep for branches missing the FOG version check stub

# Runs daily. Lists fogproject branches, filters to the ones
# check-fog-version.yml watches (working-1.6/dev-branch/rc-*/feature-*,
# `stable` excluded), and hands off any that are missing the stub to
# bootstrap-fog-version-check-stub.yml.
#
# This exists instead of a create-triggered stub in fogproject because
# GitHub only resolves a `create`-event workflow from the repo's default
# branch, which for fogproject is `stable` - and this project's automation
# is kept off of `stable` entirely. A daily delay before a brand-new branch
# starts being watched is an acceptable trade for that: it only delays when
# watching starts, it doesn't cause a missed version fix on a branch
# already being watched.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.discover.outputs.branches }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - name: Find watched branches missing the stub
        id: discover
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          all_branches=$(gh api repos/FOGProject/fogproject/branches --paginate --jq '.[].name')

          missing=()
          for b in $all_branches; do
            case "$b" in
                working-1.6|dev-branch|rc-*|feature-*) ;;
                *) continue ;;
            esac
            if ! gh api "repos/FOGProject/fogproject/contents/.github/workflows/check-fog-version.yml?ref=$b" >/dev/null 2>&1; then
              missing+=("$b")
            fi
          done

          json=$(printf '%s\n' "${missing[@]:-}" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "branches=$json" >> "$GITHUB_OUTPUT"
          echo "Missing the stub on: $json"

  bootstrap:
    needs: discover
    if: needs.discover.outputs.branches != '[]'
    strategy:
      matrix:
        branch: ${{ fromJson(needs.discover.outputs.branches) }}
    uses: ./.github/workflows/bootstrap-fog-version-check-stub.yml
    secrets: inherit
    with:
      branch: ${{ matrix.branch }}
