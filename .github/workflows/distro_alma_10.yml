name: AlmaLinux 10

# The `branch` pass-through exists so one distro can be install-tested against
# a branch by hand, without going through run_all_distros.yml. Defaulted to
# dev-branch, so a call that says nothing behaves exactly as it did before.
# fogproject GH-1220.

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: "dev-branch"
  workflow_dispatch:
    inputs:
      branch:
        description: "fogproject branch to install"
        required: false
        type: string
        default: "dev-branch"

jobs:
  almalinux-10:
    uses: ./.github/workflows/reusable_distro_workflow.yml
    with:
      distro: "docker.io/library/almalinux:10"
      package_man: "dnf"
      branch: ${{ inputs.branch || 'dev-branch' }}
