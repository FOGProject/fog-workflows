name: Check FOG version

# Hourly sweep across all watched fogproject branches. Runs entirely out of
# this repo - GitHub Actions has no native cross-repo push trigger, and
# yesterday's push-triggered design (a stub living in fogproject, calling a
# reusable workflow here) had real maintenance cost: the stub had to be
# propagated onto every watched branch by hand, and worse, a bot-authored
# fixup push back into fogproject re-triggered the stub, which re-triggered
# this workflow, which pushed another fixup - an infinite self-correcting
# commit loop that put 30 commits on dev-branch in ~20 minutes before it was
# caught. A schedule trigger sidesteps both problems: nothing about this
# workflow's own commits can cause another run, since a cron tick doesn't
# look at what was last pushed. Nothing downstream needs sub-hour freshness
# either - stable-releases.yml only runs monthly/on demand and just reads
# whatever's currently committed on dev-branch at that time.
#
# Recomputes FOG_VERSION/FOG_CHANNEL by running fogproject's own
# .githooks/lib/fog-version.sh against each watched branch - the same script
# .githooks/pre-commit calls locally - rather than keeping a second,
# separately-maintained copy of the math here. If the recomputed file
# disagrees with what's committed, pushes a fixup commit directly to that
# branch - no PR, since this mirrors the same kind of mechanical correction
# the local hook already makes.
#
# Never invoked for `stable` - that branch's version is owned entirely by
# stable-releases.yml's release flow.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Single fogproject branch to check (omit to sweep all watched branches)"
        required: false
        type: string

concurrency:
  group: fog-version-check
  cancel-in-progress: false

jobs:
  discover-branches:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - name: List watched branches
        id: list
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SINGLE_BRANCH: ${{ inputs.branch }}
        run: |
          set -e
          if [ -n "$SINGLE_BRANCH" ]; then
            branches="[\"$SINGLE_BRANCH\"]"
          else
            all=$(gh api repos/FOGProject/fogproject/branches --paginate --jq '.[].name')
            matched=$(printf '%s\n' "$all" | grep -E '^(working-1\.6|dev-branch)$|^(rc-|feature-)' || true)
            branches=$(printf '%s\n' "$matched" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  check-version:
    needs: discover-branches
    if: needs.discover-branches.outputs.branches != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: FOGProject/fogproject
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Recompute FOG_VERSION / FOG_CHANNEL
        run: sh .githooks/lib/fog-version.sh "${{ matrix.branch }}"

      - name: Commit and push if the committed version is stale
        env:
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -e
          system_file="packages/web/lib/fog/system.class.php"

          if git diff --quiet -- "$system_file"; then
            echo "Version already correct on ${{ matrix.branch }} - nothing to do."
            exit 0
          fi

          echo "Version drift detected on ${{ matrix.branch }}:"
          git diff -- "$system_file"

          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${BOT_SLUG}[bot]@users.noreply.github.com"

          git add "$system_file"
          git commit -m "chore: fix stale FOG_VERSION/FOG_CHANNEL on ${{ matrix.branch }}"
          git push origin "HEAD:${{ matrix.branch }}"
