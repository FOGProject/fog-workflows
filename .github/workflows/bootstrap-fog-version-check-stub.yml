name: Bootstrap FOG version check stub

# Single-branch worker, called by bootstrap-fog-version-check-stub-sweep.yml
# for each fogproject branch missing the stub (also runnable by hand via
# workflow_dispatch against one branch).
#
# check-fog-version.yml's push trigger only fires on a branch that already
# has a copy of that stub file committed to it. New feature-*/rc-* branches
# cut from dev-branch inherit it for free once dev-branch has it, but a
# branch created from anywhere else (or before dev-branch had it) would
# silently never be watched. This copies the canonical stub - whatever is
# currently committed on dev-branch - onto the given branch directly, if it
# matches the watched patterns and doesn't already have it.
#
# Never touches `stable` (excluded from the watched patterns, same as
# check-fog-version.yml itself) or any branch outside those patterns.
# Deliberately not triggered by anything in fogproject itself (unlike
# check-fog-version.yml's push stub) - GitHub only resolves a `create`-event
# workflow from fogproject's default branch, which is `stable`, and this
# repo's automation is kept off of `stable` entirely. The sweep workflow
# polls instead.

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: "fogproject branch to bootstrap the stub onto"
        required: true
        type: string

jobs:
  bootstrap-stub:
    runs-on: ubuntu-24.04
    steps:
      - name: Check branch matches watched patterns
        id: match
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          matches=false
          case "$BRANCH" in
              working-1.6|dev-branch|rc-*|feature-*) matches=true ;;
          esac
          echo "matches=$matches" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v3
        if: steps.match.outputs.matches == 'true'
        id: app-token
        with:
          client-id: ${{ vars.FOG_WORKFLOWS_APPID }}
          private-key: ${{ secrets.FOG_WORKFLOWS_PRIVATE_KEY }}
          owner: FOGProject
          repositories: "fogproject"

      - uses: actions/checkout@v7
        if: steps.match.outputs.matches == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: FOGProject/fogproject
          ref: ${{ inputs.branch }}

      - name: Copy the stub from dev-branch if this branch doesn't have it yet
        if: steps.match.outputs.matches == 'true'
        env:
          BRANCH: ${{ inputs.branch }}
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -e
          stub_path=".github/workflows/check-fog-version.yml"

          if [ -f "$stub_path" ]; then
            echo "Stub already present on $BRANCH - nothing to do."
            exit 0
          fi

          git fetch --depth 1 origin dev-branch
          mkdir -p "$(dirname "$stub_path")"
          git show origin/dev-branch:"$stub_path" > "$stub_path"

          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${BOT_SLUG}[bot]@users.noreply.github.com"
          git add "$stub_path"
          git commit -m "ci: bootstrap check-fog-version stub on ${BRANCH}"
          git push origin "HEAD:${BRANCH}"
